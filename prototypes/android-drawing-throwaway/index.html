<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>きゃすメイト — 手書き画面の操作見本</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="review-shell">
    <section class="introduction">
      <p class="eyebrow">きゃすメイト · 画面設計</p>
      <h1>映像いっぱいに、<br>手書き。</h1>
      <p>1本指で描く。2本指で拡大・移動。<br>道具は小さく、映像の上に。</p>
      <div class="review-controls">
        <label>画面<select id="size"><option value="320">縦 320</option><option value="400" selected>縦 400</option><option value="760">横向き</option></select></label>
        <label>配色<select id="theme"><option value="light">ライト</option><option value="dark">ダーク</option></select></label>
        <label>文字<select id="font"><option value="1">標準</option><option value="2">2倍</option></select></label>
        <label>状態<select id="scenario"><option value="normal">通常</option><option value="pending">反映待ち</option><option value="error">手書きエラー</option><option value="hidden">映像非表示</option></select></label>
      </div>
      <div class="session-controls"><button id="reopen" type="button">手書きに戻る</button><button id="new-session" type="button">新しい見本セッション</button><a href="?device=1">スマホ用表示</a></div>
      <p class="review-note">架空の映像を使う見本です。カメラ・マイク・配信には接続しません。</p>
      <p class="help">PCではドラッグで描けます。ホイールで拡大、Spaceを押しながらドラッグで移動します。色・太さは選んだら閉じます。</p>
      <details id="inspector"><summary>見本の状態を見る</summary><pre id="payload"></pre></details>
    </section>
    <div class="phone-stage">
      <section class="phone" id="phone" data-theme="light" aria-label="手書き画面の見本">
        <div class="system-bar" aria-hidden="true"><span>10:24</span><span>▰　100%</span></div>
        <div class="viewport" id="viewport">
          <canvas id="preview" aria-label="手書きプレビュー。1本指で描画、2本指で拡大と移動。"></canvas>
          <button id="inline-reopen" class="floating resume" type="button" hidden>手書きに戻る</button>
          <div class="top-controls" id="top-controls">
            <button class="floating top-button" type="button" data-action="close" aria-label="手書きを閉じる" title="手書きを閉じる"></button>
            <button class="floating top-button" type="button" data-action="sending" aria-label="送信・配信" title="送信・配信"></button>
          </div>
          <div id="state-chip" class="state-chip" role="status" hidden><span id="state-label"></span><button data-action="retry" type="button" hidden>再試行</button></div>
          <div id="zoom-label" class="zoom-label" aria-hidden="true" hidden></div>
          <nav class="floating tools" id="tools" aria-label="手書きの道具">
            <button type="button" data-action="pen" aria-label="ペン" title="ペン" aria-pressed="true"></button>
            <button type="button" data-action="eraser" aria-label="消しゴム" title="消しゴム" aria-pressed="false"></button>
            <button type="button" data-action="palette" aria-label="色と太さ" title="色と太さ"></button>
            <button type="button" data-action="undo" aria-label="元に戻す" title="元に戻す"></button>
            <button type="button" data-action="whole" aria-label="送信映像全体を表示" title="送信映像全体を表示"></button>
            <button type="button" data-action="clear" aria-label="全消去。元に戻せます" title="全消去（元に戻せます）"></button>
          </nav>
          <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
          <div class="scrim" id="scrim" hidden>
            <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="色と太さ" tabindex="-1">
              <div class="sheet-heading"><h2 id="sheet-title"></h2><button type="button" data-action="dismiss" aria-label="パネルを閉じる"></button></div>
              <div class="sheet-content" id="sheet-content"></div>
            </section>
          </div>
        </div>
        <div class="system-nav" aria-hidden="true"><span></span></div>
      </section>
    </div>
  </main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
