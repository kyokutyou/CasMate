<!-- Throwaway UI exploration: three footer-free layouts. Fictional local state; no production connections. -->
<div id="cm-no-footer">
  <div class="nf-tools"><span>フッターなしの改善案</span><label>見本の場面 <select data-scenario><option value="running">配信中</option><option value="offline">通信断</option><option value="ready">開始前</option></select></label></div>
  <div class="viz-carousel viz-dotted-background" aria-label="フッターをなくす3つの案" data-previous-label="前の案" data-next-label="次の案">
    <section data-variant="操作を上部に集約" data-design="A" aria-label="操作を上部に集約する案"><div class="nf-stage"><div class="nf-phone" data-phone="A" aria-label="上部に操作を集約する操作見本"></div></div></section>
    <section data-variant="操作をサイドに配置" data-design="B" aria-label="操作をサイドに配置する案" hidden><div class="nf-stage"><div class="nf-phone" data-phone="B" aria-label="サイドに操作を配置する操作見本"></div></div></section>
    <section data-variant="必要時だけ操作を表示" data-design="C" aria-label="必要時だけ操作を表示する案" hidden><div class="nf-stage"><div class="nf-phone" data-phone="C" aria-label="必要時だけ操作を表示する操作見本"></div></div></section>
  </div>
  <details class="nf-state"><summary>見本の状態</summary><pre data-payload></pre></details>
</div>
<style>
  #cm-no-footer{color-scheme:light dark;--nf-bg:light-dark(#f5f7f4,#151b19);--nf-surface:light-dark(#fff,#212a26);--nf-text:light-dark(#1d3029,#e9f2ec);--nf-muted:light-dark(#52685c,#b5c6bb);--nf-line:light-dark(#d9e3db,#3a4b40);--nf-soft:light-dark(#eaf1e9,#293d30);--nf-accent:light-dark(#236245,#b6e9cb);--nf-on:light-dark(#fff,#163022);--nf-danger:light-dark(#a13535,#ffb4ab);font:14px/1.5 "Segoe UI","Yu Gothic UI",Meiryo,sans-serif}
  #cm-no-footer[data-appearance=light] .nf-phone{color-scheme:light}#cm-no-footer[data-appearance=dark] .nf-phone{color-scheme:dark}
  #cm-no-footer *{box-sizing:border-box}#cm-no-footer [hidden]{display:none!important}
  #cm-no-footer button,#cm-no-footer select{font:inherit;color:inherit;cursor:inherit}#cm-no-footer button:disabled{opacity:.5;cursor:not-allowed}
  #cm-no-footer .nf-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 16px;color:var(--nf-muted)}
  #cm-no-footer .nf-tools label{display:flex;align-items:center;gap:8px}#cm-no-footer select{min-height:48px;border:1px solid var(--nf-line);background:var(--nf-surface);border-radius:10px;padding:8px}
  #cm-no-footer .nf-stage{min-height:868px;display:flex;justify-content:center;padding:20px 10px 24px}
  #cm-no-footer .nf-phone{position:relative;width:100%;max-width:398px;height:820px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--nf-line);border-radius:28px;background:var(--nf-bg);color:var(--nf-text);font-size:calc(14px * var(--nf-scale,1));box-shadow:0 16px 44px light-dark(#21352b16,#0005)}
  #cm-no-footer .nf-statusbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:24px;padding:0 20px;font-size:.8em}
  #cm-no-footer .nf-header{display:flex;flex-shrink:0;gap:4px;align-items:center;padding:4px 8px;min-height:56px;background:var(--nf-bg)}
  #cm-no-footer .nf-tabs{display:flex;flex:1;min-width:0;gap:4px;align-items:stretch}
  #cm-no-footer .nf-tabs button{flex:1;min-width:48px;min-height:48px;padding:8px 4px;border:0;border-radius:12px;background:transparent;color:var(--nf-muted);white-space:normal;overflow-wrap:anywhere}
  #cm-no-footer .nf-tabs button[aria-selected=true]{background:var(--nf-soft);color:var(--nf-accent);font-weight:500}
  #cm-no-footer .nf-icon{position:relative;width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:12px;background:transparent;color:var(--nf-accent)}
  #cm-no-footer svg{width:20px;height:20px;flex-shrink:0}#cm-no-footer .nf-dot{position:absolute;right:8px;top:8px;width:6px;height:6px;background:var(--nf-accent);border-radius:50%}#cm-no-footer .nf-dot.nf-off{background:var(--nf-danger)}
  #cm-no-footer .nf-main{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
  #cm-no-footer .nf-preview{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--nf-soft);display:flex;align-items:center;justify-content:center}
  #cm-no-footer .nf-landscape{position:absolute;inset:0;background:linear-gradient(174deg,light-dark(#90b1b8,#47666a),light-dark(#ccd6bb,#6c8262) 51%,light-dark(#849673,#425b3e) 52%)}
  #cm-no-footer .nf-mountain{position:absolute;inset:36% -12% -8%;background:light-dark(#688266,#334b37);clip-path:polygon(0 40%,24% 8%,53% 47%,73% 18%,100% 50%,100% 100%,0 100%)}
  #cm-no-footer .nf-path{position:absolute;inset:46% 8% -5%;background:light-dark(#d7d0b3,#a79f7d);clip-path:polygon(38% 0,53% 0,83% 100%,3% 100%,49% 36%)}
  #cm-no-footer .nf-badge{position:absolute;top:12px;left:12px;padding:5px 8px;border-radius:8px;background:var(--nf-surface);color:var(--nf-text);font-size:.85em;max-width:calc(100% - 24px)}
  #cm-no-footer .nf-rate{top:52px;font-variant-numeric:tabular-nums}
  #cm-no-footer .nf-scene-label{position:absolute;bottom:12px;left:12px;background:var(--nf-surface);padding:5px 8px;border-radius:8px;font-size:.8em;max-width:calc(100% - 24px);overflow-wrap:anywhere}
  #cm-no-footer .nf-preview-placeholder{padding:20px;text-align:center;font-size:1.15em;color:var(--nf-muted)}
  #cm-no-footer .nf-mic{position:absolute;top:92px;left:12px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:5px 8px;background:var(--nf-surface);border-radius:8px;font-size:.8em;color:var(--nf-muted)}
  #cm-no-footer .nf-meter{height:4px;width:48px;flex-shrink:0;background:var(--nf-line);border-radius:4px;overflow:hidden}#cm-no-footer .nf-meter span{display:block;height:100%;background:var(--nf-accent);width:45%}
  #cm-no-footer .nf-comments-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;flex-shrink:0;min-height:48px;color:var(--nf-muted);font-size:.85em}
  #cm-no-footer .nf-comment-state{position:relative;flex:1;min-width:0;overflow-wrap:anywhere;min-height:40px}
  #cm-no-footer .nf-comment-state::before{content:'コメント接続待ち\A読み上げ再接続待ち';display:block;white-space:pre-line;visibility:hidden}
  #cm-no-footer .nf-comment-state-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;overflow:auto}
  #cm-no-footer .nf-auto{flex-shrink:0;width:48px;min-height:48px;border:0;background:transparent;border-radius:12px;color:var(--nf-accent)}
  #cm-no-footer .nf-stream{flex:1;min-height:0;overflow:auto;padding:0 16px;scrollbar-width:thin;touch-action:pan-y}
  #cm-no-footer .nf-comment{display:flex;gap:10px;padding:16px 0;border-bottom:1px solid var(--nf-line)}
  #cm-no-footer .nf-avatar{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--nf-soft);color:var(--nf-accent)}
  #cm-no-footer .nf-comment-content{flex:1;min-width:0;overflow-wrap:anywhere}#cm-no-footer .nf-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.85em;color:var(--nf-muted)}#cm-no-footer .nf-meta strong{font-weight:500;color:var(--nf-text)}#cm-no-footer .nf-meta time{margin-left:auto}
  #cm-no-footer .nf-comment p{margin:4px 0 0;font-size:1.07em}
  #cm-no-footer .nf-rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:4px;border-radius:18px;background:var(--nf-surface);box-shadow:0 4px 20px light-dark(#21352b22,#0005);z-index:2}
  #cm-no-footer .nf-rail button{background:var(--nf-soft)}#cm-no-footer .nf-rail button[aria-pressed=true]{background:var(--nf-accent);color:var(--nf-on)}#cm-no-footer .nf-rail .nf-stop{color:var(--nf-danger)}
  #cm-no-footer [data-phone=B] .nf-stream{padding-right:76px}#cm-no-footer [data-phone=B] .nf-scene-label{max-width:calc(100% - 84px)}
  #cm-no-footer .nf-fab{position:absolute;right:12px;bottom:12px;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;min-width:84px;min-height:56px;padding:12px;border:0;border-radius:18px;background:var(--nf-accent);color:var(--nf-on);box-shadow:0 4px 20px light-dark(#21352b22,#0005)}
  #cm-no-footer [data-phone=C] .nf-stream{padding-bottom:76px}#cm-no-footer [data-phone=C] .nf-scene-label{max-width:calc(100% - 122px)}
  #cm-no-footer .nf-system-nav{height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--nf-bg)}#cm-no-footer .nf-system-nav span{width:92px;height:4px;border-radius:4px;background:var(--nf-text)}
  #cm-no-footer .nf-overlay{position:absolute;inset:24px 0 14px;z-index:10;background:light-dark(#1d302955,#0008);display:flex;align-items:flex-start;padding:8px}
  #cm-no-footer .nf-sheet{width:100%;max-height:100%;overflow:auto;border:1px solid var(--nf-line);border-radius:20px;padding:16px;background:var(--nf-surface);color:var(--nf-text)}
  #cm-no-footer .nf-sheet-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}#cm-no-footer .nf-sheet h2{margin:0;font-size:1.14em;font-weight:500}#cm-no-footer .nf-sheet p{margin:0 0 12px;overflow-wrap:anywhere}#cm-no-footer .nf-sheet h3{font-size:1em;font-weight:500;margin:12px 0 8px}
  #cm-no-footer .nf-action{width:100%;min-height:48px;min-width:48px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid var(--nf-line);border-radius:12px;background:var(--nf-bg);color:var(--nf-text);overflow-wrap:anywhere;white-space:normal}
  #cm-no-footer .nf-action.nf-primary{background:var(--nf-accent);color:var(--nf-on);border-color:var(--nf-accent)}#cm-no-footer .nf-action.nf-danger{color:var(--nf-danger)}#cm-no-footer .nf-action[aria-pressed=true]{background:var(--nf-soft);color:var(--nf-accent)}
  #cm-no-footer .nf-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:8px 0}#cm-no-footer .nf-stack{display:flex;flex-direction:column;gap:8px}
  #cm-no-footer .nf-state-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;min-height:48px;overflow-wrap:anywhere;color:var(--nf-muted);font-size:.9em}
  #cm-no-footer .nf-state-row span{min-width:0}#cm-no-footer .nf-state-row button{width:auto;flex-shrink:0}
  #cm-no-footer .nf-overlay.nf-popover{align-items:flex-end;justify-content:flex-end;background:light-dark(#1d302933,#0006)}#cm-no-footer .nf-popover .nf-sheet{max-width:320px}
  #cm-no-footer .nf-state{color:var(--nf-muted);margin-top:12px}#cm-no-footer .nf-state pre{white-space:pre-wrap;overflow-wrap:anywhere}
  #cm-no-footer[data-large=true] .nf-tabs{min-height:88px}#cm-no-footer[data-large=true] .nf-tabs button{padding:4px;line-height:1.35}
  #cm-no-footer[data-large=true] .nf-rate{top:76px}#cm-no-footer[data-large=true] .nf-mic{top:142px}
  #cm-no-footer[data-large=true] .nf-mic .nf-meter{display:none}#cm-no-footer[data-large=true] .nf-scene-label{display:none}
  #cm-no-footer[data-large=true] .nf-state-row{align-items:flex-start;flex-wrap:wrap}#cm-no-footer[data-large=true] .nf-grid{grid-template-columns:1fr}
  @media(max-width:350px){#cm-no-footer .nf-stage{padding-left:4px;padding-right:4px}}
</style>
<script>
(() => {
  const root=document.getElementById('cm-no-footer');
  const state={page:'camera',appearance:'light',connected:true,sending:true,broadcast:true,listening:true,mute:false,video:true,follow:true,scale:1};
  function restore(value){if(!value||typeof value!=='object')return;for(const key of ['connected','sending','broadcast','listening','mute','video','follow'])if(typeof value[key]==='boolean')state[key]=value[key];if(['camera','comments'].includes(value.page))state.page=value.page;if(['light','dark'].includes(value.appearance))state.appearance=value.appearance;if([1,2].includes(value.scale))state.scale=value.scale;}
  restore(window.openai?.widgetState?.modelContent?.noFooter);
  let modal=null,focusReturn=null;
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button=(action,label,classes='',disabled=false)=>`<button type="button" class="nf-action cursor-interaction ${classes}" data-action="${action}"${disabled?' disabled':''}>${label}</button>`;
  const small=(action,label,glyph,pressed=null,extra='',disabled=false)=>`<button type="button" class="nf-icon cursor-interaction ${extra}" data-action="${action}" aria-label="${label}" data-tooltip="${label}"${pressed===null?'':` aria-pressed="${pressed}"`}${disabled?' disabled':''}>${icon(glyph)}</button>`;
  const comments=[['は','はる','YouTube','夕焼けきれい！ 今どのあたり？','20:41'],['m','mika','Twitch','音、ちゃんと聞こえてるよ。','20:41'],['名','名無し','したらば','風つよそう。気をつけてね。','20:40'],['そ','そら','YouTube','今日もおつかれさま！','20:40'],['ま','まめ','Twitch','この道の雰囲気好き。','20:39'],['あ','あお','YouTube','向こうの空、すごく広いね。','20:39'],['k','koko','Twitch','ゆっくり歩いてね。','20:38'],['ゆ','ゆう','YouTube','いい景色。配信ありがとう。','20:38'],['名','名無し','したらば','映像も音も大丈夫です。','20:37'],['な','なつ','YouTube','帰り道も楽しみにしてる！','20:37']];
  function header(id){return `<div class="nf-statusbar"><span>20:41</span><span>▥ · 82% ▰</span></div><header class="nf-header"><div class="nf-tabs" role="tablist" aria-label="機能画面"><button type="button" class="cursor-interaction" role="tab" data-action="camera" aria-selected="${state.page==='camera'}">カメラ</button><button type="button" class="cursor-interaction" role="tab" data-action="comments" aria-selected="${state.page==='comments'}">コメント</button></div><button type="button" class="nf-icon cursor-interaction" data-action="connection" aria-label="スマホ連携：${state.connected?'接続済み':'接続待ち'}" data-tooltip="スマホ連携">${icon('monitor-smartphone')}<span class="nf-dot ${state.connected?'':'nf-off'}"></span></button>${id==='A'?small('controls','操作と設定',state.page==='camera'?'sliders-horizontal':'headphones',state.page==='comments'?state.listening:null):small('settings',state.page==='camera'?'カメラ設定':'コメント設定','settings')}</header>`;}
  function rail(){return `<div class="nf-rail" role="group" aria-label="${state.page==='camera'?'カメラの操作':'読み上げの操作'}">${state.page==='camera'?small('send',state.sending?'映像・音声の送信を停止':'OBSに映像・音声を送信',state.sending?'square':'video',null,state.sending?'nf-stop':'')+small('mute',state.mute?'ミュート解除':'マイクミュート',state.mute?'mic-off':'mic',state.mute,'',!state.sending)+small('video',state.video?'映像を隠す':'カメラに戻す',state.video?'video':'video-off',!state.video,'',!state.sending)+small('obs',state.broadcast?'OBS配信を終了':'OBS配信を開始','cast',null):small('read',state.listening?'読み上げを停止':'読み上げを聞く','headphones',state.listening)}</div>`;}
  function camera(){return `<div class="nf-preview" aria-label="カメラのプレビュー見本">${state.sending&&state.video?'<div class="nf-landscape"></div><div class="nf-mountain"></div><div class="nf-path"></div>':`<span class="nf-preview-placeholder">${!state.sending?'カメラ停止中':'映像を非表示'}</span>`}<div class="nf-badge">背面カメラ · 1.0×</div><div class="nf-badge nf-rate">${!state.connected?'再接続待ち':state.sending?'送信中 · 2.8 Mbps':'送信停止中'}</div><div class="nf-mic"><span class="nf-meter"><span style="width:${state.mute||!state.sending?'0':'45'}%"></span></span>${!state.sending?'マイク停止中':state.mute?'マイクミュート中':'マイク入力あり'}</div><span class="nf-scene-label">プレビュー見本 · OBS表示未確認</span></div>`;}
  function commentList(){return `<div class="nf-comments-top"><span class="nf-comment-state"><span class="nf-comment-state-content" role="status"><span>${state.connected?'コメント接続済み':'コメント接続待ち'}</span><span>${state.listening?(state.connected?'読み上げ中':'読み上げ再接続待ち'):'読み上げ停止中'}</span></span></span><button type="button" class="nf-auto cursor-interaction" data-action="follow" aria-label="自動スクロール：${state.follow?'オン':'オフ'}" aria-pressed="${state.follow}" data-tooltip="自動スクロール">${icon(state.follow?'arrow-down-to-line':'pause')}</button></div><div class="nf-stream" aria-label="コメント一覧">${comments.map(c=>`<article class="nf-comment"><span class="nf-avatar">${c[0]}</span><div class="nf-comment-content"><div class="nf-meta"><strong>${c[1]}</strong><span>${c[2]}</span><time>${c[4]}</time></div><p>${c[3]}</p></div></article>`).join('')}</div>`;}
  function controls(){return state.page==='camera'?`<div class="nf-stack">${button('send',state.sending?'映像・音声の送信を停止':'OBSに映像・音声を送信',state.sending?'nf-danger':'nf-primary')}<div class="nf-state-row"><span>OBS配信 · ${!state.connected?'状態不明':state.broadcast?'配信中':'停止中'}</span>${button('obs',state.broadcast?'OBS配信を終了':'OBS配信を開始',state.broadcast?'nf-danger':'',!state.connected)}</div><div class="nf-grid">${button('mute',state.mute?'ミュート解除':'マイクミュート','',!state.sending)}${button('video',state.video?'映像を隠す':'カメラに戻す','',!state.sending)}</div>${button('diagnostics','通信・診断を開く')}${button('settings','カメラ設定')}</div>`:`<div class="nf-stack">${button('read',state.listening?'読み上げを停止':'読み上げを聞く','nf-primary')}<div class="nf-state-row"><span>${state.listening?(state.connected?'読み上げ中':'読み上げ再接続待ち'):'読み上げ停止中'}</span>${button('read-details','状態詳細')}</div>${button('settings','コメント設定')}</div>`;}
  function dialogContent(kind){switch(kind){case 'controls':return {title:state.page==='camera'?'カメラの操作':'コメントの操作',body:controls()};case 'send-confirm':return {title:'映像・音声の送信を停止しますか？',body:`<p>スマホの映像とマイク音声を止めます。OBS配信と読み上げは続きます。</p>${button('confirm','送信を停止','nf-danger')}`};case 'obs-confirm':return {title:state.broadcast?'OBS配信を終了しますか？':'OBS配信を開始しますか？',body:`<p>自宅のPC · OBS ${state.broadcast?'配信中':'停止中'}</p><p>${state.broadcast?'スマホの映像・音声送信は続きます。':'OBSの映像と音声メーターを確認してください。'}</p>${button('confirm','実行する',state.broadcast?'nf-danger':'nf-primary')}`};case 'obs-unavailable':return {title:'OBS配信の状態',body:'<p>通信を確認中です。OBS配信の状態は不明です。</p>'};case 'settings':return {title:state.page==='camera'?'カメラ設定':'コメント設定',body:`<h3>配色</h3><div class="nf-grid"><button type="button" class="nf-action cursor-interaction" data-action="light" aria-pressed="${state.appearance==='light'}">ライトモード</button><button type="button" class="nf-action cursor-interaction" data-action="dark" aria-pressed="${state.appearance==='dark'}">ダークモード</button></div>${state.page==='camera'?`<h3>カメラ・送信</h3><div class="nf-stack">${button('camera-options','映像・カメラ調整')}${button('quality','送信品質・配信マイク')}${button('diagnostics','通信・診断を開く')}</div>`:'<p>コメントの文字サイズ・表示項目・配色はPCの「コメント一覧」で設定できます。</p>'}${button('connection','スマホ連携を開く')}`};case 'connection':return {title:'スマホ連携',body:`<p>自宅のPC · Tailscale · ${state.connected?'接続済み':'接続待ち'}</p>${button('qr','QRコードを読み込む','nf-primary')}${button('connection-details','接続の詳細')}`};case 'qr':return {title:'QRコードを読み込む',body:'<p>PCの「スマホ連携」に表示した共通QRを読み込む画面の見本です。</p>'};case 'connection-details':return {title:'接続の詳細',body:`<p>Tailscale · ${state.connected?'接続済み':'通信を確認中'}</p>`};case 'diagnostics':return {title:'通信・診断',body:`<p>${state.connected?'送信中 · 実送信 2.8 Mbps':'再接続待ち · 実送信 —'}</p><p>OBS表示未確認</p><div class="nf-grid">${button('diagnostic-detail','通信の詳細')}${button('diagnostic-detail','数値履歴')}</div>`};case 'read-details':return {title:'読み上げの状態',body:`<p>${state.listening?(state.connected?'新着コメントを読み上げています。':'通信を確認中です。再接続を待っています。'):'停止中です。'}</p>`};case 'camera-options':return {title:'映像・カメラ調整',body:'<p>背面カメラ · 1.0× · 露出補正 0</p><p>映像の向き、カメラ選択、ライト、ズーム、露出補正を設定する画面の見本です。</p>'};case 'quality':return {title:'送信品質・配信マイク',body:'<p>自動ビットレート · H.264</p><p>送信品質と配信マイクを調整する画面の見本です。</p>'};default:return {title:'通信の詳細',body:'<p>数値診断を確認する画面の見本です。</p>'};}}
  function render(){const scrolls=new Map([...root.querySelectorAll('[data-phone]')].map(p=>[p.dataset.phone,p.querySelector('.nf-stream')?.scrollTop||0]));root.dataset.appearance=state.appearance;root.dataset.large=String(state.scale===2);root.style.setProperty('--nf-scale',state.scale);for(const phone of root.querySelectorAll('[data-phone]')){const id=phone.dataset.phone;phone.innerHTML=header(id)+`<main class="nf-main">${state.page==='camera'?camera():commentList()}${id==='B'?rail():id==='C'?`<button type="button" class="nf-fab cursor-interaction" data-action="controls" aria-label="${state.page==='camera'?'カメラの操作':'コメントの操作'}">${icon('sliders-horizontal')}<span>操作</span></button>`:''}</main><div class="nf-system-nav" aria-hidden="true"><span></span></div>`;if(modal?.id===id){const content=dialogContent(modal.kind);phone.insertAdjacentHTML('beforeend',`<div class="nf-overlay ${id==='C'&&modal.kind==='controls'?'nf-popover':''}"><section class="nf-sheet" role="dialog" aria-modal="true" aria-label="${content.title}"><div class="nf-sheet-header"><h2>${content.title}</h2>${small('close','閉じる','x')}</div>${content.body}</section></div>`);}const list=phone.querySelector('.nf-stream');if(list)list.scrollTop=scrolls.get(id)||0;}root.querySelector('[data-scenario]').value=!state.connected?'offline':!state.sending&&!state.broadcast?'ready':'running';root.querySelector('[data-payload]').textContent=JSON.stringify({...state,dialog:modal?.kind||null},null,2);globalThis.lucide?.createIcons({attrs:{width:20,height:20}});}
  function save(){window.openai?.setWidgetState?.({modelContent:{noFooter:{...state}},privateContent:null})?.catch(()=>{});}
  function openDialog(id,kind,action){focusReturn={id,action:action||'controls'};modal={id,kind};render();root.querySelector(`[data-phone="${id}"] .nf-sheet button:not(:disabled)`)?.focus({preventScroll:true});save();}
  function closeDialog(){modal=null;render();if(focusReturn){const phone=root.querySelector(`[data-phone="${focusReturn.id}"]`);(phone?.querySelector(`[data-action="${focusReturn.action}"]`)||phone?.querySelector('[data-action="controls"]')||phone?.querySelector('[data-action="settings"]'))?.focus({preventScroll:true});}focusReturn=null;save();}
  function act(action,id){switch(action){case 'camera':case 'comments':state.page=action;modal=null;break;case 'controls':case 'settings':case 'connection':case 'qr':case 'connection-details':case 'camera-options':case 'quality':case 'diagnostics':case 'diagnostic-detail':case 'read-details':openDialog(id,action,action);return;case 'close':closeDialog();return;case 'send':if(state.sending){openDialog(id,'send-confirm','send');return;}state.sending=true;break;case 'obs':openDialog(id,state.connected?'obs-confirm':'obs-unavailable','obs');return;case 'confirm':if(modal?.kind==='send-confirm')state.sending=false;else if(modal?.kind==='obs-confirm')state.broadcast=!state.broadcast;closeDialog();return;case 'read':state.listening=!state.listening;break;case 'mute':if(!state.sending)return;state.mute=!state.mute;break;case 'video':if(!state.sending)return;state.video=!state.video;break;case 'follow':state.follow=!state.follow;break;case 'light':case 'dark':state.appearance=action;break;default:return;}render();save();root.querySelector(`[data-phone="${id}"] [data-action="${action}"]`)?.focus({preventScroll:true});}
  root.addEventListener('click',event=>{const target=event.target.closest('button[data-action]');if(target&&!target.disabled){const phone=target.closest('[data-phone]');if(phone)act(target.dataset.action,phone.dataset.phone);}else if(event.target.classList.contains('nf-overlay'))closeDialog();});
  root.querySelector('[data-scenario]').addEventListener('change',event=>{const scenario=event.target.value;state.connected=scenario!=='offline';state.sending=scenario!=='ready';state.broadcast=scenario!=='ready';modal=null;render();save();});
  root.addEventListener('keydown',event=>{if(!modal)return;const sheet=root.querySelector('.nf-sheet');if(event.key==='Escape'){event.preventDefault();closeDialog();}else if(event.key==='Tab'&&sheet){const controls=[...sheet.querySelectorAll('button:not(:disabled)')].filter(x=>x.checkVisibility());if(!controls.length)return;const index=controls.indexOf(document.activeElement);if(event.shiftKey&&index<=0){event.preventDefault();controls.at(-1).focus();}else if(!event.shiftKey&&(index<0||index===controls.length-1)){event.preventDefault();controls[0].focus();}}});
  let gesture=null;
  root.addEventListener('pointerdown',event=>{if(modal||event.target.closest('button,input,select,.nf-sheet')||!event.target.closest('.nf-main'))return;if(gesture||event.isPrimary===false){gesture=null;return;}gesture={id:event.pointerId,x:event.clientX,y:event.clientY,time:event.timeStamp,valid:true};});
  root.addEventListener('pointermove',event=>{if(!gesture)return;if(event.pointerId!==gesture.id){gesture=null;return;}if(Math.abs(event.clientY-gesture.y)>12&&Math.abs(event.clientY-gesture.y)>=Math.abs(event.clientX-gesture.x))gesture.valid=false;});
  root.addEventListener('pointercancel',()=>{gesture=null;});
  root.addEventListener('pointerup',event=>{if(!gesture)return;const value=gesture;gesture=null;const dx=event.clientX-value.x,dy=event.clientY-value.y;if(event.pointerId!==value.id||!value.valid||Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.5||event.timeStamp-value.time>700)return;if(state.page==='camera'&&dx<0)state.page='comments';else if(state.page==='comments'&&dx>0)state.page='camera';else return;render();save();});
  window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState?.modelContent?.noFooter);modal=null;render();});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{modal=null;render();save();}});tweak.addSelect(state,'appearance',{label:'配色',options:[{label:'ライト',value:'light'},{label:'ダーク',value:'dark'}]});tweak.addSelect(state,'page',{label:'画面',options:[{label:'カメラ',value:'camera'},{label:'コメント',value:'comments'}]});tweak.addSlider(state,'scale',{label:'文字倍率',min:1,max:2,step:1,unit:'倍'});}
  window.casmateNoFooterMock={getState:()=>({...state,dialog:modal?.kind||null}),setState:value=>{restore(value);modal=null;render();}};
})();
</script>
