<div id="cd-lab">

<script>
// Throwaway UI comparison. Every mutation is local to this mockup; no production APIs.
(() => {
  const root = document.getElementById('cd-lab');
  const stage = root.querySelector('#cd-variants');
  const restored = window.openai?.widgetState;
  const initial = { network: 'direct', active: 'direct', mode: 'manual', adapter: 'ethernet', ports: { lan: '3001', tailscale: '3001', direct: '3001' }, endpoints: { tcp: [{ family: 'ipv4', address: '203.0.113.24', port: '43001' }], phone: [{ family: 'ipv4', address: '203.0.113.24', port: '43002' }], spare: [{ family: 'ipv4', address: '203.0.113.24', port: '43003' }] } };
  let settings = structuredClone(initial);
  if (restored?.privateContent?.settings?.ports && restored.privateContent.settings.endpoints) settings = restored.privateContent.settings;
  const state = { settings, saved: structuredClone(settings), scenario: 'ready', saving: false, invalid: false, error: '', confirmed: { tcp: true, phone: true, spare: true }, busy: false, tabs: { A: 'settings', B: 'router', C: 'router' }, keyGeneration: 1 };
  let saveTimer; let toastTimer; let pendingAction; let opener;
  const names = { lan: '家庭内LAN', tailscale: 'Tailscale', direct: '直接接続' };
  const variants = { A: ['目的別タブ', '設定・状態・保守を切り替える'], B: ['手順ガイド', 'PC → ルーター → 受信確認の順に進む'], C: ['接続経路図', 'スマホからPCまでの経路で確認する'], D: ['設定一覧', '設定値と準備状況を同時に見る'] };

  const button = (label, action, css = '', extra = '') => `<button type="button" class="${css} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
  const field = (variant, key, label, value, help = '', type = 'text') => `<label class="cd-field">${label}<input aria-label="${label}" data-setting="${key}" value="${escape(value)}" type="${type}" ${type === 'number' ? 'min="1024" max="65535"' : ''}><small class="cd-help" data-help="${key}">${help}</small></label>`;
  function port(v) { return field(v, 'statusPort', 'PC内部のTCPポート', state.settings.ports[state.settings.network], '通常は3001。1024〜65535の整数。', 'number'); }
  function adapter() { return `<label class="cd-field">PCの接続先ネットワーク<select aria-label="PCの接続先ネットワーク" data-setting="adapter"><option value="default">Windowsの既定の接続先</option><option value="ethernet">イーサネット · 192.168.1.20</option><option value="wifi">Wi-Fi · 192.168.1.31</option></select><small class="cd-help">保存した接続先がなくなった場合は、選び直します。</small></label>`; }
  function method() { return `<div class="cd-method" aria-label="ルーターの開放方法">${button('<b>自動で開放</b><small>UPnP／PCPで準備</small>', 'mode-auto', '', 'aria-pressed="false"')}${button('<b>ルーターで手動設定</b><small>公開IPとポートを指定</small>', 'mode-manual', '', 'aria-pressed="true"')}</div>`; }
  function row(v, kind, endpoint, index) {
    const key = `${kind}:${index}`; const labels = { tcp: '登録・コメント・OBS操作', phone: 'Pixel 8 · 映像・配信マイク', spare: 'Xperia · 映像・配信マイク' };
    const localPort = kind === 'tcp' ? state.settings.ports.direct : kind === 'phone' ? '42001' : '42002';
    return `<div class="cd-endpoint" data-endpoint="${key}"><div class="cd-endpoint-head"><span><span class="cd-protocol">${kind === 'tcp' ? 'TCP' : 'UDP'}</span>${labels[kind]}${index ? ` · 候補${index + 1}` : ''}</span><div class="cd-inline"><select aria-label="${labels[kind]}のIP方式${index + 1}" data-setting="family:${key}" style="width:auto;min-height:30px;padding:3px 6px;font-size:11px"><option value="ipv4">IPv4</option><option value="ipv6">IPv6</option></select>${index ? button('削除', `remove:${key}`, 'quiet', 'aria-label="この接続先候補を削除"') : ''}</div></div>

  function modal(trigger,title,body,accept) { const dialog=trigger.closest('.cd-app').querySelector('dialog');opener=trigger;dialog.querySelector('[data-modal-title]').textContent=title;dialog.querySelector('[data-modal-body]').textContent=body;dialog.querySelector('[data-modal-accept]').hidden=!accept;pendingAction=accept;dialog.showModal();dialog.querySelector('[data-action="close-dialog"]').focus(); }
  root.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const [action,a,b]=el.dataset.action.split(':');
    if(action==='tab'){selectTab(a,b);return;}
    if(action==='network'){state.settings.network=a;sync();persist();return;}
    if(action==='mode-auto'||action==='mode-manual'){state.settings.mode=action==='mode-auto'?'auto':'manual';save();return;}
    if(action==='active'){state.settings.active=state.settings.active===state.settings.network?null:state.settings.network;save();return;}
    if(action==='confirm'){state.confirmed[a]=true;toast('手動設定の確認を記録しました。');sync();return;}
    if(action==='add'){const kind=root.querySelector(`[data-add-target="${a}"]`).value;const list=state.settings.endpoints[kind];if(list.length>=4){modal(el,'接続先候補の上限','候補は同じ用途につき最大4件です。',false);return;}list.push({family:'ipv6',address:'2001:db8::24',port:kind==='tcp'?'43001':kind==='phone'?'43002':'43003'});state.confirmed[kind]=false;rebuildEndpoints();save();return;}
    if(action==='remove'){state.settings.endpoints[a].splice(Number(b),1);state.confirmed[a]=false;rebuildEndpoints();save();return;}
    if(action==='retry'||action==='cleanup'||action==='refresh'){state.busy=true;sync();setTimeout(()=>{state.busy=false;toast(action==='retry'?'受信準備を再試行しました。':action==='cleanup'?'残存設定の確認を完了しました。':'ネットワーク一覧を更新しました。');sync();},700);return;}
    if(action==='reset-key'){modal(el,'PC確認鍵を再生成','直接接続の全スマホ登録が無効になります。各Androidで共通QRを読み直してください。',true);return;}
    if(action==='warnings'){modal(el,'確認が必要な内容',state.error||(state.invalid?'未保存の入力があります。IPアドレスとポートを確認してください。':state.scenario==='udp-error'?'Pixel 8の映像準備に失敗しました。コメントと他端末の通信は維持しています。':state.scenario==='residual'?'削除できたと確認できない開放設定があります。保守から確認してください。':state.scenario==='unsupported'?'自動開放に未対応です。手動設定の可否を確認してください。':'現在、要確認事項はありません。'),false);return;}
    if(action==='back'){modal(el,'設定一覧への移動','比較見本では接続の詳細設定だけを再構築しています。入力値は見本内に保持します。',false);return;}
    if(action==='close-dialog'||action==='accept-dialog'){if(action==='accept-dialog'&&pendingAction){state.keyGeneration++;toast('PC確認鍵を再生成しました。');payload();}el.closest('dialog').close();opener?.focus();}
  });
  function edit(el) { const [key,kind,index]=el.dataset.setting.split(':');if(key==='statusPort')state.settings.ports[state.settings.network]=el.value;else if(key==='adapter')state.settings.adapter=el.value;else{state.settings.endpoints[kind][Number(index)][{address:'address',endpointPort:'port',family:'family'}[key]]=el.value;state.confirmed[kind]=false;}save(); }
  root.addEventListener('input',event=>{if(event.target.matches('input[data-setting]')&&!event.isComposing)edit(event.target);});
  root.addEventListener('compositionend',event=>{if(event.target.matches('input[data-setting]'))edit(event.target);});
  root.addEventListener('change',event=>{if(event.target.matches('select[data-setting]'))edit(event.target);if(event.target.id==='cd-scenario'){state.scenario=event.target.value;state.error='';if(state.scenario==='unsupported')state.settings.mode='auto';rebuildEndpoints();payload();persist();}});
  root.querySelectorAll('dialog').forEach(dialog=>{dialog.addEventListener('cancel',()=>{setTimeout(()=>opener?.focus(),0);});dialog.addEventListener('keydown',event=>{if(event.key!=='Tab')return;const buttons=[...dialog.querySelectorAll('button:not([hidden]):not(:disabled)')];if(event.shiftKey&&document.activeElement===buttons[0]){event.preventDefault();buttons.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===buttons.at(-1)){event.preventDefault();buttons[0].focus();}});});
  window.addEventListener('openai:set_globals',event=>{const restored=event.detail?.globals?.widgetState?.privateContent?.settings;if(restored?.ports&&restored.endpoints){state.settings=restored;rebuildEndpoints();}});
  sync();
})();
</script>
