<!-- Throwaway: compare three headerless Android layouts. All states and actions are fictional and local. -->
<div id="cm-headerless">
  <div class="hl-tools"><span>ヘッダーなしの比較</span><label>見本の場面 <select data-scenario><option value="running">配信中</option><option value="offline">通信断</option><option value="ready">開始前</option></select></label></div>
  <div class="viz-carousel viz-dotted-background" aria-label="ヘッダーなしの改善案" data-previous-label="前の案" data-next-label="次の案">
    <section data-variant="下部にひとまとめ" data-design="A"><div class="hl-stage"><div class="hl-phone" data-phone="A" aria-label="下部にひとまとめの見本"></div><div class="hl-measure" data-measure="A"></div></div></section>
    <section data-variant="切替ボタンとフリック" data-design="B" hidden><div class="hl-stage"><div class="hl-phone" data-phone="B" aria-label="切替ボタンとフリックの見本"></div><div class="hl-measure" data-measure="B"></div></div></section>
    <section data-variant="全画面と操作シート" data-design="C" hidden><div class="hl-stage"><div class="hl-phone" data-phone="C" aria-label="全画面と操作シートの見本"></div><div class="hl-measure" data-measure="C"></div></div></section>
  </div>
  <details class="hl-state"><summary>見本の状態</summary><pre data-payload></pre></details>
</div>
<style>
 #cm-headerless{color-scheme:light dark;--hl-bg:light-dark(#f5f7f4,#151b19);--hl-surface:light-dark(#fff,#212a26);--hl-text:light-dark(#1d3029,#e9f2ec);--hl-muted:light-dark(#52685c,#b5c6bb);--hl-line:light-dark(#d9e3db,#3a4b40);--hl-soft:light-dark(#eaf1e9,#293d30);--hl-accent:light-dark(#236245,#b6e9cb);--hl-on:light-dark(#fff,#163022);--hl-danger:light-dark(#a13535,#ffb4ab);font:14px/1.5 "Segoe UI","Yu Gothic UI",Meiryo,sans-serif}
 #cm-headerless[data-appearance=light]{color-scheme:light}#cm-headerless[data-appearance=dark]{color-scheme:dark}
 #cm-headerless *{box-sizing:border-box}#cm-headerless [hidden]{display:none!important}
 #cm-headerless button,#cm-headerless select{font:inherit;color:inherit}#cm-headerless button{cursor:inherit}
 #cm-headerless .hl-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 16px;color:var(--hl-muted)}
 #cm-headerless .hl-tools label{display:flex;align-items:center;gap:8px}#cm-headerless select{min-height:48px;border:1px solid var(--hl-line);background:var(--hl-surface);border-radius:10px;padding:8px}
 #cm-headerless .hl-stage{min-height:906px;display:flex;flex-direction:column;align-items:center;padding:16px 8px 12px;gap:14px}
 #cm-headerless .hl-phone{position:relative;isolation:isolate;width:100%;max-width:398px;height:820px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--hl-line);border-radius:28px;background:var(--hl-bg);color:var(--hl-text);font-size:calc(14px * var(--hl-scale,1));box-shadow:0 16px 44px light-dark(#21352b16,#0005)}
 #cm-headerless .hl-statusbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:24px;padding:0 22px;font-size:12px}
 #cm-headerless .hl-main{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;padding:4px 8px;touch-action:pan-y}
 #cm-headerless .hl-preview{flex:1;min-height:220px;position:relative;overflow:hidden;border-radius:18px;background:var(--hl-soft);display:flex;align-items:center;justify-content:center}
 #cm-headerless .hl-landscape{position:absolute;inset:0;background:linear-gradient(174deg,light-dark(#90b1b8,#47666a),light-dark(#ccd6bb,#6c8262) 51%,light-dark(#849673,#425b3e) 52%)}
 #cm-headerless .hl-mountain{position:absolute;inset:38% -12% -8%;background:light-dark(#688266,#334b37);clip-path:polygon(0 40%,24% 8%,53% 47%,73% 18%,100% 50%,100% 100%,0 100%)}
 #cm-headerless .hl-path{position:absolute;inset:48% 10% -5%;background:light-dark(#d7d0b3,#a79f7d);clip-path:polygon(38% 0,53% 0,83% 100%,3% 100%,49% 36%)}
 #cm-headerless .hl-top-marks{position:absolute;inset:10px 10px auto;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px;pointer-events:none}
 #cm-headerless .hl-mark{padding:4px 8px;border-radius:8px;background:var(--hl-surface);color:var(--hl-text);font-size:.85em;max-width:100%;overflow-wrap:anywhere}
 #cm-headerless .hl-attention{color:var(--hl-danger)}
 #cm-headerless .hl-preview-bottom{position:absolute;bottom:10px;left:10px;right:10px;display:flex;flex-direction:column;gap:6px}
 #cm-headerless .hl-caption{align-self:flex-start;background:var(--hl-surface);padding:4px 8px;border-radius:8px;font-size:.8em;overflow-wrap:anywhere}
 #cm-headerless .hl-preview-controls{display:flex;align-items:stretch;gap:6px}
 #cm-headerless .hl-preview-controls button{flex:1}
 #cm-headerless svg{width:18px;height:18px;flex-shrink:0}
 #cm-headerless .hl-button{min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--hl-line);padding:6px 8px;border-radius:12px;background:var(--hl-surface);color:var(--hl-text);white-space:normal;overflow-wrap:anywhere}
 #cm-headerless .hl-primary{background:var(--hl-accent);color:var(--hl-on);border-color:var(--hl-accent)}
 #cm-headerless .hl-button[aria-pressed=true],#cm-headerless .hl-tab[aria-selected=true]{background:var(--hl-soft);color:var(--hl-accent)}
 #cm-headerless button:disabled{opacity:.5;cursor:not-allowed}
 #cm-headerless .hl-meter{display:flex;align-items:center;gap:8px;min-height:26px;font-size:.8em;color:var(--hl-muted);flex-shrink:0}
 #cm-headerless .hl-track{height:4px;flex:1;border-radius:4px;background:var(--hl-line);overflow:hidden}#cm-headerless .hl-track span{display:block;height:100%;width:43%;background:var(--hl-accent)}
 #cm-headerless .hl-dock{flex-shrink:0;display:flex;align-items:stretch;gap:4px;padding:4px 8px;background:var(--hl-surface);border-top:1px solid var(--hl-line)}
 #cm-headerless .hl-tab{flex:1;min-width:48px;min-height:48px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-size:.85em;overflow-wrap:anywhere}
 #cm-headerless .hl-dock .hl-action{flex:1.7;min-width:0;flex-direction:column;font-size:.9em;gap:0}
 #cm-headerless .hl-action small{font-size:.85em}
 #cm-headerless .hl-menu{width:48px;flex-shrink:0;border:0}
 #cm-headerless .hl-flip{flex:1;min-width:0;flex-direction:column;font-size:.85em}
 #cm-headerless .hl-home{height:14px;flex-shrink:0;display:flex;justify-content:center;align-items:center;background:var(--hl-surface)}#cm-headerless .hl-home span{width:92px;height:4px;border-radius:4px;background:var(--hl-text)}
 #cm-headerless .hl-comments{display:block;padding:0 14px;scrollbar-width:thin}
 #cm-headerless .hl-comment{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--hl-line)}
 #cm-headerless .hl-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--hl-soft);color:var(--hl-accent);display:grid;place-items:center}
 #cm-headerless .hl-content{flex:1;min-width:0;overflow-wrap:anywhere}
 #cm-headerless .hl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--hl-muted);font-size:.85em}#cm-headerless .hl-meta strong{color:var(--hl-text);font-weight:500}#cm-headerless .hl-meta time{margin-left:auto}
 #cm-headerless .hl-comment p{margin:4px 0 0;font-size:1.07em}
 #cm-headerless .hl-list-status{position:absolute;right:12px;bottom:76px;pointer-events:none;border:1px solid var(--hl-line);border-radius:8px;padding:4px 8px;background:var(--hl-surface);font-size:.8em;max-width:calc(100% - 24px)}
 #cm-headerless .hl-full .hl-main{padding:0}#cm-headerless .hl-full .hl-preview{border-radius:0}
 #cm-headerless .hl-full .hl-comments{padding:0 14px 100px}
 #cm-headerless .hl-floating{position:absolute;bottom:24px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
 #cm-headerless .hl-floating button{pointer-events:auto;max-width:calc(50% - 4px);font-size:.93em;border-radius:18px;box-shadow:0 4px 16px light-dark(#21352b22,#0006)}
 #cm-headerless .hl-full .hl-preview-bottom{bottom:86px}
 #cm-headerless .hl-full .hl-list-status{bottom:88px}
 #cm-headerless .hl-overlay{position:absolute;inset:0;background:light-dark(#1d302966,#0009);z-index:10;display:flex;align-items:flex-end;padding:10px}
 #cm-headerless .hl-sheet{width:100%;max-height:90%;overflow:auto;background:var(--hl-surface);border:1px solid var(--hl-line);border-radius:20px;padding:16px;color:var(--hl-text)}
 #cm-headerless .hl-sheet h2{font-size:1.14em;font-weight:500;margin:0 0 12px}#cm-headerless .hl-sheet p{margin:0 0 12px;overflow-wrap:anywhere}
 #cm-headerless .hl-sheet .hl-button{width:100%;margin-bottom:8px}#cm-headerless .hl-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
 #cm-headerless .hl-sheet-label{font-size:.85em;color:var(--hl-muted);margin:12px 0 4px}
 #cm-headerless .hl-measure{color:var(--hl-muted);font-size:12px;min-height:36px;text-align:center;display:flex;align-items:center;justify-content:center}
 #cm-headerless .hl-state{color:var(--hl-muted);margin-top:12px}#cm-headerless .hl-state pre{white-space:pre-wrap;overflow-wrap:anywhere}
 #cm-headerless[data-large=true] .hl-preview-controls{flex-wrap:wrap}#cm-headerless[data-large=true] .hl-preview-controls button{flex-basis:100%}
 #cm-headerless[data-large=true] .hl-caption{font-size:.8em}#cm-headerless[data-large=true] .hl-dock{align-items:stretch}
 #cm-headerless[data-large=true] .hl-tab{font-size:.7em}#cm-headerless[data-large=true] .hl-list-status{font-size:.7em}
 #cm-headerless .hl-top-marks .hl-mark{max-width:calc(100% - 4px)}
</style>
<script>
(() => {
 const root=document.getElementById('cm-headerless');
 const state={page:'camera',appearance:'light',connected:true,sending:true,listening:true,mute:false,video:true,broadcast:true,follow:true,scale:1};
 let modal=null,owner='A',focusReturn=null,gesture=null;
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const rows=[['は','はる','YouTube','夕焼けきれい！今どのあたり？','20:41'],['m','mika','Twitch','音、ちゃんと聞こえてるよ。','20:41'],['名','名無し','したらば','風つよそう。気をつけてね。','20:40'],['そ','そら','YouTube','今日もおつかれさま！','20:40'],['ま','まめ','Twitch','この道の雰囲気好き。','20:39'],['ゆ','ゆう','YouTube','もうすぐ日が沈みそうだね。','20:39'],['k','kuma','Twitch','映像も音も大丈夫です。','20:38'],['な','なつ','YouTube','あたたかい色でいいね。','20:38'],['の','のり','したらば','帰り道も気をつけて。','20:37'],['あ','あき','YouTube','今日もありがとう！','20:37']];
 function restore(value){if(!value||typeof value!=='object')return;for(const k of ['connected','sending','listening','mute','video','broadcast','follow'])if(typeof value[k]==='boolean')state[k]=value[k];if(['camera','comments'].includes(value.page))state.page=value.page;if(['light','dark'].includes(value.appearance))state.appearance=value.appearance;if([1,2].includes(value.scale))state.scale=value.scale;}
 restore(window.openai?.widgetState?.modelContent?.headerless);
 function button(label,action,extra='',style=''){return `<button type="button" class="hl-button cursor-interaction ${style}" data-action="${action}" ${extra}>${label}</button>`;}
 function primary(){return button(`${state.page==='camera'?(state.sending?'送信停止':'送信開始'):(state.listening?'読み上げ停止':'読み上げを聞く')}<small>${state.page==='camera'?(state.connected?(state.sending?'送信中':'停止中'):'再接続待ち'):(state.listening?(state.connected?'コメント待機中':'再接続待ち'):'停止中')}</small>`,state.page==='camera'?'send':'read','','hl-primary hl-action');}
 function flip(){return button(`${icon(state.page==='camera'?'message-circle':'camera')}<span>${state.page==='camera'?'コメント':'カメラ'}</span>`,'flip','','hl-flip');}
 function body(id){if(state.page==='comments')return `<main class="hl-main hl-comments" aria-label="コメント一覧">${rows.map(([a,n,s,t,time])=>`<article class="hl-comment"><span class="hl-avatar">${a}</span><div class="hl-content"><div class="hl-meta"><strong>${n}</strong><span>${s}</span><time>${time}</time></div><p>${t}</p></div></article>`).join('')}</main>${!state.connected?'<div class="hl-list-status hl-attention" role="status">コメント再接続待ち</div>':''}`;
 const controls=id==='C'?'':`<div class="hl-preview-controls">${button(icon(state.mute?'mic-off':'mic')+(state.mute?'ミュート解除':'マイクミュート'),'mic',`aria-pressed="${state.mute}" ${state.sending?'':'disabled'}`)}${button(icon(state.video?'video':'video-off')+(state.video?'映像を隠す':'カメラに戻す'),'video',`aria-pressed="${!state.video}" ${state.sending?'':'disabled'}`)}</div>`;
 return `<main class="hl-main" aria-label="カメラプレビュー"><div class="hl-preview">${state.video?'<div class="hl-landscape"><div class="hl-mountain"></div><div class="hl-path"></div></div>':'<span>カメラ停止中</span>'}<div class="hl-top-marks"><span class="hl-mark">背面 · 1.0×</span><span class="hl-mark ${state.connected?'':'hl-attention'}">${state.connected?(state.sending?'送信 2.8 Mbps':'送信停止中'):'再接続待ち'}</span></div><div class="hl-preview-bottom"><span class="hl-caption">OBS ${!state.connected?'状態不明':state.broadcast?'配信中':'停止中'} · 表示未確認</span>${controls}</div></div>${id==='C'?'':`<div class="hl-meter"><div class="hl-track"><span style="width:${state.mute||!state.sending?0:43}%"></span></div><span>${state.mute?'ミュート中':state.sending?'マイク入力あり':'マイク停止中'}</span></div>`}</main>`;
 }
 function footer(id){if(id==='C')return `<div class="hl-floating">${flip()}${button(icon('sliders-horizontal')+'操作','menu')}</div>`;if(id==='B')return `<footer class="hl-dock">${primary()}${flip()}${button(icon('more-horizontal'),'menu','aria-label="操作メニュー"','hl-menu')}</footer>`;return `<footer class="hl-dock">${[['camera','カメラ','camera'],['comments','コメント','message-circle']].map(([page,label,glyph])=>`<button type="button" class="hl-tab cursor-interaction" data-action="page" data-page="${page}" aria-selected="${state.page===page}">${icon(glyph)}<span>${label}</span></button>`).join('')}${primary()}${button(icon('more-horizontal'),'menu','aria-label="操作メニュー"','hl-menu')}</footer>`;}
 function sheet(id){if(!modal||id!==owner)return '';let content='';if(modal==='menu')content=`<h2>${state.page==='camera'?'カメラの操作':'コメントの操作'}</h2>${id==='C'?primary():''}${state.page==='camera'?`<p>OBS配信：${!state.connected?'状態不明':state.broadcast?'配信中':'停止中'}</p>${button(state.broadcast?'OBS配信を終了':'OBS配信を開始','obs',state.connected?'':'disabled')}${id==='C'?`<div class="hl-two">${button(state.mute?'ミュート解除':'マイクミュート','mic',state.sending?'':'disabled')}${button(state.video?'映像を隠す':'カメラに戻す','video',state.sending?'':'disabled')}</div>`:''}${button('通信・診断','details')}`:`${button('自動スクロール：'+(state.follow?'オン':'オフ'),'follow',`aria-pressed="${state.follow}"`)}${button('読み上げの状態','details')}`}<div class="hl-sheet-label">設定と接続</div>${button(state.page==='camera'?'カメラ設定':'コメント設定','settings')}${button('スマホ連携 · '+(state.connected?'接続済み':'接続待ち'),'connection')}`;
 else if(modal==='settings')content=`<h2>${state.page==='camera'?'カメラ設定':'コメント設定'}</h2><p>配色</p><div class="hl-two">${button('ライトモード','theme','data-theme="light" aria-pressed="'+(state.appearance==='light')+'"')}${button('ダークモード','theme','data-theme="dark" aria-pressed="'+(state.appearance==='dark')+'"')}</div><p>${state.page==='camera'?'映像・配信マイク・カメラ調整・送信品質':'コメント表示・読み上げ'}</p>`;
 else if(modal==='connection')content=`<h2>スマホ連携</h2><p>自宅のPC · Tailscale<br>${state.connected?'接続済み':'接続待ち'}</p>${button('PCのQRコードを読み取る','qr')}`;
 else if(modal==='qr')content='<h2>PCのQRを読み取る</h2><p>PC版の設定 → スマホ連携 → 共通QR</p>';
 else if(modal==='details')content=`<h2>${state.page==='camera'?'通信・診断':'読み上げの状態'}</h2><p>${state.page==='camera'?(state.connected?'実送信 2.8 Mbps · OBS表示未確認':'再接続待ち · OBS配信は状態不明'):(state.listening?(state.connected?'コメント待機中':'再接続待ち'):'停止中')}</p>`;
 else content=`<h2>${modal==='send'?'映像・音声の送信を停止しますか？':state.broadcast?'OBS配信を終了しますか？':'OBS配信を開始しますか？'}</h2><p>${modal==='send'?'スマホの映像とマイク音声を止めます。OBS配信・コメント・読み上げは継続します。':'スマホの映像・音声送信と読み上げは変更しません。'}</p>${button(modal==='send'?'送信を停止':'実行する','confirm')}`;
 return `<div class="hl-overlay"><section class="hl-sheet" role="dialog" aria-modal="true" aria-label="操作と設定">${content}${button(['send','obs'].includes(modal)?'キャンセル':'閉じる','close')}</section></div>`;
 }
 function measure(){for(const p of root.querySelectorAll('[data-phone]'))if(p.checkVisibility()){root.querySelector(`[data-measure="${p.dataset.phone}"]`).textContent=`上部 0px · ${p.dataset.phone==='C'?'操作は画面内に表示':`下部 ${p.querySelector('.hl-dock').offsetHeight}px`} · 本文 ${p.querySelector('.hl-main').clientHeight}px`;}}
 function render(){const active=document.activeElement;const focus=active?.closest('[data-phone]')?{id:active.closest('[data-phone]').dataset.phone,action:active.dataset.action,page:active.dataset.page,theme:active.dataset.theme}:null;const scrolls=new Map([...root.querySelectorAll('[data-phone]')].map(p=>[p.dataset.phone,p.querySelector('.hl-main')?.scrollTop||0]));root.dataset.appearance=state.appearance;root.dataset.large=String(state.scale===2);root.style.setProperty('--hl-scale',state.scale);for(const p of root.querySelectorAll('[data-phone]')){const id=p.dataset.phone;p.classList.toggle('hl-full',id==='C');p.innerHTML=`<div class="hl-statusbar"><span>20:41</span><span>▥ · 82% ▰</span></div>${body(id)}${footer(id)}<div class="hl-home"><span></span></div>${sheet(id)}`;p.querySelector('.hl-main').scrollTop=scrolls.get(id)||0;}root.querySelector('[data-payload]').textContent=JSON.stringify({...state,dialog:modal,variant:owner},null,2);globalThis.lucide?.createIcons({attrs:{width:18,height:18}});if(focus?.action){let selector=`[data-phone="${focus.id}"] [data-action="${focus.action}"]`;if(focus.page)selector+=`[data-page="${focus.page}"]`;if(focus.theme)selector+=`[data-theme="${focus.theme}"]`;root.querySelector(selector)?.focus({preventScroll:true});}requestAnimationFrame(measure);}
 function save(){window.openai?.setWidgetState?.({modelContent:{headerless:{...state}},privateContent:null})?.catch(()=>{});}
 function page(next){if(modal||next===state.page)return;state.page=next;render();save();}
 function close(){modal=null;render();if(focusReturn)root.querySelector(`[data-phone="${focusReturn.id}"] [data-action="${focusReturn.action}"]`)?.focus({preventScroll:true});focusReturn=null;}
 root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;owner=b.closest('[data-phone]').dataset.phone;if(a==='page'){page(b.dataset.page);return;}if(a==='flip'){page(state.page==='camera'?'comments':'camera');return;}if(a==='close'){close();return;}if(a==='theme')state.appearance=b.dataset.theme;else if(a==='read')state.listening=!state.listening;else if(a==='mic')state.mute=!state.mute;else if(a==='video')state.video=!state.video;else if(a==='follow')state.follow=!state.follow;else if(a==='confirm'){if(modal==='send')state.sending=false;else if(modal==='obs'&&state.connected)state.broadcast=!state.broadcast;close();save();return;}else if(a==='send'){if(state.sending)modal='send';else state.sending=true;}else if(['menu','settings','connection','qr','details','obs'].includes(a)){if(a==='obs'&&!state.connected)return;modal=a;}if(modal&&!focusReturn)focusReturn={id:owner,action:a};render();save();if(modal)root.querySelector(`[data-phone="${owner}"] .hl-sheet button:not(:disabled)`)?.focus();});
 root.querySelector('[data-scenario]').addEventListener('change',e=>{state.connected=e.target.value!=='offline';state.sending=state.listening=state.broadcast=e.target.value!=='ready';modal=null;render();save();});
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){e.preventDefault();close();return;}if(modal&&e.key==='Tab'){const s=e.target.closest('.hl-sheet');if(!s)return;const buttons=[...s.querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&e.target===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&e.target===buttons.at(-1)){e.preventDefault();buttons[0].focus();}return;}if(modal||e.target.closest('button,input,select,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'&&state.page==='camera')page('comments');if(e.key==='ArrowRight'&&state.page==='comments')page('camera');});
 root.addEventListener('pointerdown',e=>{if(modal||e.button!==0||e.target.closest('button,input,select,textarea,a')||!e.target.closest('.hl-main'))return;if(gesture){gesture=null;return;}gesture={id:e.pointerId,x:e.clientX,y:e.clientY,t:e.timeStamp};});
 root.addEventListener('pointermove',e=>{if(gesture&&(e.pointerId!==gesture.id||e.timeStamp-gesture.t>700||Math.abs(e.clientY-gesture.y)>12&&Math.abs(e.clientY-gesture.y)>=Math.abs(e.clientX-gesture.x)))gesture=null;});
 root.addEventListener('pointerup',e=>{const g=gesture;gesture=null;if(!g||g.id!==e.pointerId||e.timeStamp-g.t>700)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.abs(dx)>=56&&Math.abs(dx)>=Math.abs(dy)*1.5){if(dx<0&&state.page==='camera')page('comments');else if(dx>0&&state.page==='comments')page('camera');}});
 root.addEventListener('pointercancel',()=>{gesture=null;});window.addEventListener('blur',()=>{gesture=null;});
 window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.modelContent?.headerless);modal=null;render();});
 new MutationObserver(measure).observe(root.querySelector('.viz-carousel'),{subtree:true,attributes:true,attributeFilter:['hidden']});new ResizeObserver(measure).observe(root);
 render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'scale',{label:'文字倍率',min:1,max:2,step:1});}
 window.casmateHeaderlessMock={getState:()=>({...state,dialog:modal}),setState:value=>{restore(value);modal=null;render();},measure};
})();
</script>
