<div id="acquisition-designs" aria-label="コメント取得のUI比較">
  <div class="ca-window">
    <header class="ca-header">
      <div class="ca-brand"><span class="ca-logo" aria-hidden="true">き</span><strong>きゃすメイト</strong></div>

<script>
(() => {
  const root = document.getElementById('acquisition-designs');
  const q = selector => root.querySelector(selector);

  const keys = ['youtube', 'twitch', 'shitaraba'];
  const names = { youtube: 'YouTube Live', twitch: 'Twitch', shitaraba: 'したらば' };

  const placeholders = { youtube: 'https://www.youtube.com/@your_channel', twitch: 'チャンネル名 または https://www.twitch.tv/...', shitaraba: 'https://jbbs.shitaraba.net/bbs/read.cgi/カテゴリ/掲示板ID/スレッドID/' };
  const captions = { A: 'A｜接続リスト　3つの接続先と状態を一度に確認。普段の配信準備におすすめ。', B: 'B｜ソース別ワークスペース　一覧から選び、1つの接続先に集中。説明を読みながら設定。', C: 'C｜順番に準備　接続先 → 自動接続 → 接続確認。初めての設定で迷いにくい構成。' };

  let initialVariant = 'A';
  try { initialVariant = new URL(location.href).searchParams.get('variant') || 'A'; } catch { /* inline hosts may not expose navigation */ }
  const state = { variant: ['A', 'B', 'C'].includes(initialVariant) ? initialVariant : 'A', page: 'editor', origin: 'settings', selected: 'youtube', step: 0, autoConnect: false, interval: '5', savedInterval: 5, intervalError: '', sources: fresh(), scenario: 'normal', saveFailure: false, savePending: false };

  let toastTimer;
  const escape = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const active = key => state.sources[key].status !== 'stopped' && (state.sources[key].status !== 'error' || state.sources[key].enabled);
  const busy = key => Boolean(pending[key]);
  const status = key => `<span class="ca-status" data-status="${key}" data-state="${state.sources[key].status}">${labels[state.sources[key].status]}</span>`;
  const mark = key => `<span class="ca-mark ${key}" aria-hidden="true">${{youtube:'▶',twitch:'Tw',shitaraba:'板'}[key]}</span>`;
  const identity = (key, short = false) => `<span class="ca-source-id">${mark(key)}<span>${short ? shortNames[key] : names[key]}</span></span>`;
  const toggle = key => `<label class="ca-switch"><input type="checkbox" role="switch" data-toggle="${key}" aria-label="${names[key]}のコメント取得" ${active(key) ? 'checked' : ''}><span data-switch-label="${key}">${active(key) ? 'オン' : 'オフ'}</span></label>`;
  const retry = (key, extra = '') => `<button class="ca-retry ${extra}" data-retry="${key}" aria-label="${names[key]}を再接続">再接続</button>`;
  function interval() { return `<label class="ca-interval">取得間隔 <input id="ca-interval" type="number" min="3" max="60" step="1" value="${escape(state.interval)}" aria-describedby="ca-interval-help">秒 <span id="ca-interval-help">3〜60秒</span></label>`; }
  function field(key) { return `<div class="ca-fields"><label class="ca-field" for="ca-target-${key}">${key === 'youtube' ? 'YouTube接続先' : key === 'twitch' ? 'Twitchチャンネル名' : 'したらばスレッドURL'}<input id="ca-target-${key}" type="text" data-target="${key}" value="${escape(state.sources[key].target)}" placeholder="${placeholders[key]}" aria-describedby="ca-help-${key}" autocomplete="off" spellcheck="false"></label>${key === 'shitaraba' ? interval() : ''}<p id="ca-help-${key}" data-help="${key}" class="ca-help" aria-live="polite">${hints[key]}</p></div>`; }
  function automatic() { return `<div class="ca-auto"><div><h3>アプリ起動時に自動接続</h3><p>有効なコメントソースに、次回の起動時から接続します。</p></div><label class="ca-switch"><input id="ca-auto" type="checkbox" role="switch" aria-label="アプリ起動時に自動接続" ${state.autoConnect ? 'checked' : ''}><span id="ca-auto-label">${state.autoConnect ? 'オン' : 'オフ'}</span></label></div>`; }
  function toolbar() { return `<div class="ca-toolbar"><span class="ca-counter" data-counter></span><div class="ca-row"><button class="ca-primary" data-action="start-all">有効な接続を一括開始</button><button data-action="stop-all">すべて停止</button></div></div>`; }
  function VariantA() { return `${toolbar()}<div class="ca-sources">${keys.map(key => `<article class="ca-source-row"><div class="ca-source-side">${identity(key)}${status(key)}${retry(key)}</div><div class="ca-fields">${field(key)}<span class="ca-mobile-retry" hidden>${retry(key)}</span></div>${toggle(key)}</article>`).join('')}</div>${automatic()}`; }
  function VariantB() { const key = state.selected; return `${toolbar()}<div class="ca-workspace"><nav class="ca-selector" aria-label="編集するコメントソース">${keys.map(k => `<button data-source="${k}" aria-pressed="${k === key}">${identity(k, true)}${status(k)}</button>`).join('')}</nav><section class="ca-detail" aria-label="${names[key]}の設定"><div class="ca-detail-title"><h2>${identity(key)}</h2>${toggle(key)}</div>${field(key)}<div class="ca-detail-status">${status(key)}${retry(key)}</div><p class="ca-detail-hint">${key === 'youtube' ? '毎回同じチャンネルで配信するなら @ハンドルが便利です。' : key === 'twitch' ? 'ログイン不要で接続できます。過去のコメントは取得しません。' : '接続時の直近100レスもコメント一覧で確認できます。'}</p></section></div>${automatic()}`; }
  function VariantC() { return `<nav class="ca-steps" aria-label="準備の手順">${['接続先を入力','自動接続を設定','接続を確認'].map((name, i) => `<button data-step="${i}" ${state.step === i ? 'aria-current="step"' : ''}><span class="ca-step-number">${i+1}</span>${name}</button>`).join('')}</nav><section class="ca-step-body">${state.step === 0 ? `<div><h2>使うコメントソースの接続先を入力</h2><p class="ca-muted ca-small">使わない接続先は空欄のままで進めます。</p></div>${keys.map(key => `<div class="ca-step-fields">${identity(key, true)}${field(key)}</div>`).join('')}` : state.step === 1 ? `<div><h2>次回からのひと手間を減らす</h2><p class="ca-muted ca-small">自動接続の対象は、接続確認でオンにしたコメントソースです。</p></div>${automatic()}<p class="ca-muted ca-small">オフにしておくと、アプリ起動後に手動で接続できます。<br>この項目だけをオンにしても、今すぐ接続は始まりません。</p>` : `<div><h2>使う接続をオンにする</h2><p class="ca-muted ca-small">スイッチで個別に開始・停止できます。</p></div><div>${keys.map(key => `<div class="ca-step-connection"><div>${identity(key, true)}<p class="ca-summary-target">${escape(state.sources[key].target || '接続先は未入力')}</p></div><div class="ca-summary-status">${status(key)}${retry(key)}</div>${toggle(key)}</div>`).join('')}</div>${toolbar()}<button class="ca-quiet" data-action="edit-inputs">接続先・取得間隔を見直す ←</button>`}</section><div class="ca-step-footer"><button data-step="${Math.max(0,state.step-1)}" ${state.step === 0 ? 'disabled' : ''}>戻る</button><span class="ca-muted ca-small">${state.step+1} / 3</span><button class="ca-primary" ${state.step < 2 ? `data-step="${state.step+1}"` : 'data-page="home"'}>${state.step < 2 ? '次へ →' : 'ホームへ'}</button></div>`; }
  function render() {
    if (state.page === 'editor') q('#ca-content').innerHTML = `<div class="ca-heading"><button class="ca-quiet ca-back" data-page="${state.origin}">← ${state.origin === 'home' ? 'ホーム' : '設定'}に戻る</button><h1>コメント取得</h1><p>配信先につないで、コメントをひとつに。</p></div>${({A:VariantA,B:VariantB,C:VariantC}[state.variant])()}<p class="ca-footnote">ログイン不要・各コメントソースにつき接続先は1件。接続前のコメントは一覧だけに表示します。</p>`;
    else if (state.page === 'home') q('#ca-content').innerHTML = `<div class="ca-heading"><h1>ホーム</h1><p>コメント取得の状態と操作</p></div><div class="ca-toolbar"><h2>コメント取得</h2><button class="ca-quiet" data-action="open-editor">接続先を変更 →</button></div><div class="ca-home-grid">${keys.map(key => `<article class="ca-home-card"><button class="ca-quiet" data-edit="${key}">${identity(key,true)} →</button>${status(key)}${toggle(key)}</article>`).join('')}</div>`;
    else q('#ca-content').innerHTML = `<div class="ca-heading"><h1>設定</h1><p>コメント</p></div><button class="ca-entry" data-action="open-editor"><span>コメント取得<small>接続先・取得間隔・自動接続・状態と復旧</small></span><span>→</span></button>`;
    qa('[data-page]').forEach(el => el.setAttribute('aria-current', (el.dataset.page === (state.page === 'home' ? 'home' : 'settings')) ? 'page' : 'false'));
    qa('[data-variant]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.variant === state.variant)));
    q('#ca-comparison-caption').textContent = captions[state.variant];
    sync();
  }
  function warnings() { const result = keys.filter(k => state.sources[k].error || ['error','reconnecting'].includes(state.sources[k].status)).map(key => ({key, text: state.sources[key].error || '接続が切れたため、自動で再接続しています。'})); if (state.saveFailure) result.unshift({key:'save',text:'設定を保存できませんでした。入力内容は保持しています。'}); if (state.intervalError) result.push({key:'interval',text:state.intervalError}); return result; }
  function help(key) { const s = state.sources[key]; if (s.error) return s.error; if (key === 'shitaraba' && state.intervalError) return state.intervalError; if (s.status === 'waiting') return '配信開始を待っています。30秒ごとに確認します。'; if (s.status === 'reconnecting') return '通信が途切れました。自動で再接続しています。'; if (s.status === 'connecting') return '接続を確認しています…'; return hints[key]; }
  function sync() {
    qa('[data-status]').forEach(el => { const s = state.sources[el.dataset.status]; el.dataset.state = s.status; el.textContent = labels[s.status]; el.setAttribute('aria-label', `${names[el.dataset.status]}：${labels[s.status]}、最終更新 ${s.updated}`); });
    qa('[data-toggle]').forEach(el => { el.checked = active(el.dataset.toggle); el.disabled = busy(el.dataset.toggle); });
    qa('[data-switch-label]').forEach(el => { el.textContent = active(el.dataset.switchLabel) ? 'オン' : 'オフ'; });
    qa('[data-help]').forEach(el => { const k = el.dataset.help; el.textContent = help(k); el.classList.toggle('ca-invalid', Boolean(state.sources[k].error || (k === 'shitaraba' && state.intervalError))); });
    qa('[data-target]').forEach(el => { el.setAttribute('aria-invalid', String(Boolean(state.sources[el.dataset.target].error))); });
    qa('[data-retry]').forEach(el => { const s = state.sources[el.dataset.retry]; el.disabled = busy(el.dataset.retry) || s.status === 'stopped' || !s.enabled; el.textContent = busy(el.dataset.retry) ? '接続中…' : '再接続'; });
    qa('[data-counter]').forEach(el => { el.textContent = `${keys.filter(k => state.sources[k].status === 'connected').length} / 3 接続済み`; });
    q('#ca-warning-count').textContent = warnings().length;
    const auto = q('#ca-auto'); if (auto) { auto.checked = state.autoConnect; q('#ca-auto-label').textContent = state.autoConnect ? 'オン' : 'オフ'; }
    q('#ca-payload').textContent = JSON.stringify(state, null, 2);
    if (q('#ca-warning-dialog').open) renderWarnings();
  }
  function toast(message) { clearTimeout(toastTimer); q('#ca-toast-text').textContent = message; q('#ca-toast').hidden = false; q('#ca-toast').setAttribute('aria-label', message); q('#ca-toast').setAttribute('data-tooltip',message); toastTimer = setTimeout(() => { q('#ca-toast').hidden = true; }, 4000); }
  function validate(key) {
    const value = state.sources[key].target.trim();
    if (!value) return '接続先を入力してください。';
    if (key === 'youtube') { if (/^@[\w.\-\p{L}\p{N}]+$/u.test(value) || /^[\w-]{11}$/.test(value) || /^UC[\w-]{22}$/.test(value)) return ''; try { const u = new URL(value); if (['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname) && (/^\/@[^/]+\/?$/.test(u.pathname) || /^\/channel\/UC[\w-]{22}\/?$/.test(u.pathname) || /^\/live\/[\w-]{11}\/?$/.test(u.pathname) || (u.pathname === '/watch' && /^[\w-]{11}$/.test(u.searchParams.get('v') || '')))) return ''; if (u.hostname === 'youtu.be' && /^\/[\w-]{11}\/?$/.test(u.pathname)) return ''; } catch { /* show field validation */ } return '配信URL・11文字のLive ID・@ハンドルを入力してください。'; }
    if (key === 'twitch') { if (/^[a-zA-Z0-9_]{1,25}$/.test(value)) return ''; try { const u = new URL(value); if (['twitch.tv','www.twitch.tv'].includes(u.hostname) && /^\/[a-zA-Z0-9_]{1,25}\/?$/.test(u.pathname)) return ''; } catch { /* show field validation */ } return 'Twitchのチャンネル名またはチャンネルURLを入力してください。'; }
    if (/^https?:\/\/jbbs\.shitaraba\.net\/bbs\/read\.cgi\/[a-zA-Z0-9_]+\/\d+\/\d+\/?(?:\?.*)?$/.test(value)) return '';
    return 'jbbs.shitaraba.net のスレッドURLを入力してください。';
  }
  function setStatus(key, value) { state.sources[key].status = value; state.sources[key].updated = new Date().toLocaleTimeString('ja-JP'); }
  function connect(key, enable = true) {
    if (busy(key)) return;
    const s = state.sources[key];
    s.error = validate(key);
    if (key === 'shitaraba' && state.intervalError) { sync(); return; }
    if (s.error) { setStatus(key,'error'); sync(); return; }
    if (state.saveFailure) { sync(); return; }
    s.savedTarget = s.target.trim();
    if (enable) s.enabled = true;
    setStatus(key,'connecting');
    pending[key] = setTimeout(() => { delete pending[key]; setStatus(key, key === 'youtube' && s.target.includes('@') ? 'waiting' : 'connected'); sync(); toast(`${shortNames[key]}：接続結果を更新しました（見本）。`); }, 650);
    sync();
  }
  function stop(key, preserve) { clearTimeout(pending[key]); delete pending[key]; if (!preserve && state.saveFailure) return; if (!preserve) state.sources[key].enabled = false; state.sources[key].error = ''; setStatus(key,'stopped'); }
  function saveDrafts() {
    clearTimeout(saveTimer); state.savePending = false;
    keys.forEach(key => { const s = state.sources[key]; s.error = s.target.trim() ? validate(key) : ''; if (!state.saveFailure && !s.error && s.savedTarget !== s.target) { s.savedTarget = s.target; if (active(key)) connect(key); } });
    const n = Number(state.interval); state.intervalError = !state.interval.trim() || !Number.isInteger(n) || n < 3 || n > 60 ? '取得間隔は3〜60秒の整数で入力してください。' : '';
    if (!state.saveFailure && !state.intervalError && n !== state.savedInterval) { state.savedInterval = n; if (active('shitaraba')) connect('shitaraba'); }
    sync();
    if (!state.saveFailure && !state.intervalError && !keys.some(k => state.sources[k].error)) toast('変更を反映しました（見本内のみ）。');
  }
  function renderWarnings() { const list = warnings(); q('#ca-warning-list').innerHTML = list.length ? list.map(w => `<div class="ca-warning-item"><strong>${w.key === 'save' ? '設定の保存' : w.key === 'interval' ? 'したらばの取得間隔' : names[w.key]}</strong><p class="ca-small ca-muted">${escape(w.text)}</p><button data-warning-target="${w.key}" class="ca-quiet">${w.key === 'save' ? '保存を再試行' : '該当する設定を開く →'}</button></div>`).join('') : '<p class="ca-muted">現在、要確認事項はありません。</p>'; }
  function openEditor(key) { if (state.page !== 'editor') state.origin = state.page; state.page = 'editor'; if (key) { state.selected = key; state.step = 0; } render(); if (key) q(`#ca-target-${key}`)?.focus(); }
  function variant(value) { state.variant = value; state.page = 'editor'; try { const url = new URL(location.href); url.searchParams.set('variant', value); history.replaceState(null,'',url); } catch { /* comparison remains local in inline hosts */ } render(); }
  function scenario(value) {
    clearTimeout(saveTimer); keys.forEach(k => { clearTimeout(pending[k]); delete pending[k]; });
    state.sources = fresh(); state.scenario = value; state.saveFailure = value === 'save-error'; state.savePending = false; state.interval = '5'; state.savedInterval = 5; state.intervalError = ''; state.autoConnect = false;
    if (value === 'empty') keys.forEach(k => Object.assign(state.sources[k],{target:'',savedTarget:'',enabled:false,status:'stopped'}));
    if (value === 'connecting') keys.slice(0,2).forEach(k => setStatus(k,'connecting'));
    if (value === 'reconnecting') setStatus('youtube','reconnecting');
    if (value === 'error') Object.assign(state.sources.shitaraba,{target:'https://jbbs.shitaraba.net/',enabled:true,status:'error',error:'掲示板トップではなく、スレッドURLを入力してください。'});
    render();
  }
  root.addEventListener('input', event => {
    const el = event.target;
    if (el.dataset.target) state.sources[el.dataset.target].target = el.value;
    else if (el.id === 'ca-interval') state.interval = el.value;
    else return;
    clearTimeout(saveTimer); state.savePending = true; saveTimer = setTimeout(saveDrafts,500); sync();
  });
  root.addEventListener('change', event => {
    const el = event.target;
    if (el.dataset.toggle) { if (el.checked) connect(el.dataset.toggle); else { stop(el.dataset.toggle,false); sync(); if (!state.saveFailure) toast(`${shortNames[el.dataset.toggle]}を停止しました（見本）。`); } }
    if (el.id === 'ca-auto') { if (!state.saveFailure) { state.autoConnect = el.checked; toast('自動接続の設定を変更しました（見本）。'); } sync(); }
    if (el.id === 'ca-scenario') scenario(el.value);
  });
  root.addEventListener('click', event => {
    const el = event.target.closest('button'); if (!el) return;
    if (el.dataset.variant) variant(el.dataset.variant);
    if (el.dataset.cycle) variant(['A','B','C'][( ['A','B','C'].indexOf(state.variant) + Number(el.dataset.cycle) + 3) % 3]);
    if (el.dataset.page) { state.page = el.dataset.page; render(); }
    if (el.dataset.source) { state.selected = el.dataset.source; render(); }
    if (el.dataset.step !== undefined) { state.step = Number(el.dataset.step); render(); }
    if (el.dataset.edit) openEditor(el.dataset.edit);
    if (el.dataset.retry) connect(el.dataset.retry);
    if (el.dataset.action === 'open-editor') openEditor();
    if (el.dataset.action === 'edit-inputs') { state.step = 0; render(); }
    if (el.dataset.action === 'start-all') { saveDrafts(); keys.filter(k => state.sources[k].enabled).forEach(k => connect(k)); }
    if (el.dataset.action === 'stop-all') { keys.forEach(k => stop(k,true)); sync(); toast('すべて停止しました（見本）。'); }
    if (el.dataset.action === 'warnings') { renderWarnings(); q('#ca-warning-dialog').showModal(); }
    if (el.dataset.action === 'close-warnings') q('#ca-warning-dialog').close();
    if (el.dataset.warningTarget) { q('#ca-warning-dialog').close(); const k = el.dataset.warningTarget; if (k === 'save') { state.saveFailure = false; saveDrafts(); } else openEditor(k === 'interval' ? 'shitaraba' : k); }
  });
  root.addEventListener('keydown', event => { if (!['ArrowLeft','ArrowRight'].includes(event.key) || event.target.closest('input,textarea,select,[contenteditable=true],dialog')) return; event.preventDefault(); variant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+(event.key === 'ArrowRight' ? 1 : 2))%3]); });
  q('#ca-warning-dialog').addEventListener('close', () => { if (document.activeElement === document.body || document.activeElement?.closest('dialog')) q('[data-action=warnings]').focus(); });
  render();
  if (globalThis.Tweak) { const controls = new globalThis.Tweak({container:root,onChange:() => variant(state.variant)}); controls.addSelect(state,'variant',{label:'画面構成',options:[{label:'A 接続リスト',value:'A'},{label:'B ソース別',value:'B'},{label:'C 順番に準備',value:'C'}]}); }
})();
</script>
