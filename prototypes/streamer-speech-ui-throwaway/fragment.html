<!-- Throwaway UI exploration: three layouts inside the existing management shell. Memory-only mock actions. -->
<style>

#sr-designs .sr-model-copy{display:grid;gap:3px;flex:1}

#sr-designs .sr-result small{font-variant-numeric:tabular-nums}

#sr-designs input[type=checkbox]{accent-color:var(--sr-accent)}

#sr-designs summary:after{content:'＋';color:var(--sr-muted);flex:none}

#sr-designs details.sr-fold{padding:6px 18px;border:1px solid var(--sr-line);border-radius:10px;background:var(--sr-panel)}
#sr-designs .sr-fold-body{padding:10px 0 13px;display:grid;gap:14px}
#sr-designs .sr-history{display:grid;gap:10px;padding-top:8px}
#sr-designs .sr-history article{border-top:1px solid var(--sr-line);padding-top:9px;display:grid;gap:4px}
#sr-designs .sr-history time{font-size:12px;color:var(--sr-muted)}

#sr-designs .sr-stepper button{text-align:left;background:transparent;border:0;border-bottom:2px solid var(--sr-line);border-radius:0;padding:10px 4px}
#sr-designs .sr-stepper button[aria-pressed=true]{border-color:var(--sr-accent);color:var(--sr-accent)}
#sr-designs .sr-step-stage{max-width:690px;width:100%;margin:0 auto;display:grid;gap:17px}
#sr-designs .sr-step-title{padding-top:4px;display:grid;gap:5px}
#sr-designs .sr-step-title h2{font-size:21px}
#sr-designs .sr-step-actions{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--sr-line);padding-top:15px}
#sr-designs .sr-workbench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

#sr-designs .sr-workbench .sr-preview-head{align-items:start}
#sr-designs .sr-workbench .sr-result{min-height:180px}
#sr-designs .sr-workbench .sr-apply{align-items:start}
#sr-designs .sr-workbench .sr-apply button{width:100%}
#sr-designs .sr-ready{display:grid;gap:8px;border-left:3px solid var(--sr-accent);padding:4px 0 4px 15px}
#sr-designs .sr-url{display:block;word-break:break-all;color:var(--sr-muted);font-size:12px;background:var(--sr-bg);padding:10px;border-radius:6px}
#sr-designs .sr-switcher{display:flex;align-items:center;justify-content:center;gap:12px;padding:15px 0}
#sr-designs .sr-switcher span{min-width:148px;text-align:center;font-size:12px}
#sr-designs .sr-payload{font-size:12px;color:var(--sr-muted)}
#sr-designs pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}
#sr-designs dialog{color:var(--sr-text);background:var(--sr-panel);border:1px solid var(--sr-line);border-radius:12px;padding:20px;max-width:480px;width:calc(100% - 32px)}
#sr-designs dialog::backdrop{background:#0008}
#sr-designs .sr-modal-body{display:grid;gap:16px;padding-top:16px}

@media(max-width:800px){#sr-designs .sr-workbench{grid-template-columns:1fr}#sr-designs .sr-workbench .sr-fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){#sr-designs .sr-brand-name,#sr-designs .sr-connect-label{display:none}#sr-designs .sr-toast{width:calc(100% - 116px);max-width:280px}#sr-designs .sr-header{padding:0 16px}#sr-designs .sr-nav{padding:0 16px}#sr-designs .sr-main{padding:16px;gap:14px}#sr-designs .sr-options button{padding:10px}#sr-designs .sr-options small{display:none}#sr-designs .sr-fields,#sr-designs .sr-workbench .sr-fields{grid-template-columns:repeat(2,minmax(0,1fr))}#sr-designs .sr-block,#sr-designs .sr-preview{padding:14px}#sr-designs .sr-options strong{font-size:12px}#sr-designs .sr-stepper button{font-size:12px}}
@media(max-width:390px){#sr-designs h1{font-size:21px}#sr-designs .sr-main{padding:12px}#sr-designs .sr-fields,#sr-designs .sr-workbench .sr-fields{grid-template-columns:1fr}#sr-designs .sr-field .sr-help{height:37px}#sr-designs .sr-mic-row{grid-template-columns:1fr}#sr-designs .sr-mic-row button{justify-self:start}#sr-designs .sr-stepper .sr-number{display:none}#sr-designs .sr-stepper button{padding:10px 0}#sr-designs .sr-preview-head button{width:100%}#sr-designs .sr-apply button{width:100%}#sr-designs .sr-options{gap:5px}#sr-designs .sr-options button{padding:8px 6px}}
@media(pointer:coarse){#sr-designs button,#sr-designs summary{min-height:44px}#sr-designs input[type=number],#sr-designs select{font-size:16px}#sr-designs .sr-switch,#sr-designs .sr-check{min-height:44px}}
</style>
<div id="sr-designs" aria-label="配信者音声認識の画面比較">
  <div class="sr-gallery">
    <div class="sr-options" aria-label="デザインを比較">
      <button type="button" data-variant="A" aria-pressed="true"><b>A · 日常の使いやすさ</b><strong>シンプルな一画面</strong><small>マイクを選び、その場で確認</small></button>
      <button type="button" data-variant="B" aria-pressed="false"><b>B · はじめての準備</b><strong>3ステップガイド</strong><small>入力を準備 → プレビューで確認 → 配信に使う</small></button>
      <button type="button" data-variant="C" aria-pressed="false"><b>C · 認識を追い込む</b><strong>調整ワークスペース</strong><small>設定と認識結果を見比べる</small></button>
    </div>
    <div class="sr-sim"><span>操作見本・架空データ</span><label>再現する状態 <select id="sr-scenario"><option value="ready">通常</option><option value="missing">初回・モデル未取得</option><option value="downloading">モデル取得中</option><option value="microphone">マイク切断</option><option value="failed">モデル取得失敗</option><option value="save-error">設定の保存失敗</option></select></label><button type="button" id="sr-sample" disabled>発話を再現</button></div>
  </div>
  <div class="sr-window">
    <header class="sr-header"><div class="sr-brand"><span class="sr-logo">き</span><span class="sr-brand-name">きゃすメイト</span></div><div id="sr-toast" class="sr-toast" role="status" aria-live="polite" hidden></div><span class="sr-connected" aria-label="ローカル接続済み">✓ <span class="sr-connect-label">ローカル接続</span></span></header>
    <nav class="sr-nav" aria-label="メイン"><button type="button" data-page="home">ホーム</button><button type="button" data-page="settings" aria-current="page">設定</button><button type="button" class="sr-warning" id="sr-warnings">⚠ 要確認 <span id="sr-warning-count">0</span>件</button></nav>
    <main class="sr-main" id="sr-main"></main>
    <dialog id="sr-dialog" aria-labelledby="sr-dialog-title"><div class="sr-row sr-between"><h2 id="sr-dialog-title">要確認</h2><button type="button" id="sr-close-dialog">閉じる</button></div><div class="sr-modal-body" id="sr-dialog-content"></div></dialog>
  </div>
  <div class="sr-switcher" aria-label="見本切替"><button type="button" id="sr-prev" aria-label="前の案">←</button><span id="sr-variant-label">A · シンプルな一画面</span><button type="button" id="sr-next" aria-label="次の案">→</button></div>
  <details class="sr-payload"><summary>見本の状態を確認</summary><pre id="sr-payload"></pre></details>
</div>
<script>
(() => {
  const root = document.getElementById('sr-designs');
  const $ = selector => root.querySelector(selector);
  const names = { A: 'シンプルな一画面', B: '3ステップガイド', C: '調整ワークスペース' };
  let queryVariant = 'A';
  try { queryVariant = new URLSearchParams(location.search).get('variant') || 'A'; } catch { /* host may omit URL */ }
  const defaults = { microphone: 'Windowsの既定', vad: 0.3, minimum: 0.25, silence: 0.5, maximum: 30, before: 0.3, after: 0 };
  const state = { variant: names[queryVariant] ? queryVariant : 'A', page: 'editor', origin: 'settings', step: 0, enabled: false, preview: false, wav: false, scenario: 'ready', model: 'ready', busy: false, draft: { ...defaults }, applied: { ...defaults }, errors: {}, history: [], opened: {}, toast: '', resultCount: 0 };
  let timer;
  let operationTimer;
  const fields = [
    ['vad', '声として拾う基準', 'VAD閾値', 0.01, 0.99, 0.01, '大きくすると、声と判定する基準が厳しくなります。'],
    ['silence', '話し終わりの待ち時間', '無音判定・秒', 0.05, 5, 0.05, 'この長さの無音で、発話を区切ります。'],
    ['minimum', '短い音を除く', '最短発話・秒', 0.05, 5, 0.05, 'これより短い発話は認識しません。'],
    ['maximum', '長い発話を区切る', '最長発話・秒', 0.05, 300, 0.5, '最短発話より長く、300秒以下にします。'],
    ['before', '語頭を補う', '発話前・秒', 0, 3, 0.1, '検出前の音声を、ここまで含めます。'],
    ['after', '語尾を補う', '発話後・秒', 0, 3, 0.1, '検出後の音声を、ここまで含めます。'],
  ];
  const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dirty = () => JSON.stringify(state.draft) !== JSON.stringify(state.applied);
  const requested = () => state.enabled || state.preview;
  const running = () => requested() && state.model === 'ready' && state.scenario !== 'microphone';
  const status = () => state.scenario === 'microphone' ? '利用不可・マイクを確認' : state.model === 'failed' ? '利用不可・モデル取得失敗' : ['downloading', 'extracting', 'validating'].includes(state.model) ? 'モデルを準備中' : running() ? '待受中' : '停止中';
  const issue = () => state.scenario === 'microphone' ? '選択したマイクを利用できません。接続を確認し、再試行してください。別のマイクへ自動変更はしません。' : state.model === 'failed' ? 'モデルを取得できませんでした。通信と空き容量を確認し、再試行してください。' : state.scenario === 'save-error' ? '設定を保存できませんでした。未適用の入力を保持しています。保存を再試行してください。' : Object.keys(state.errors).length ? '入力値を確認してください。認識の調整にある説明欄で、修正が必要な項目を確認できます。' : '';
  const btn = (action, text, primary = false, disabled = false) => `<button type="button" id="sr-action-${action}" data-action="${action}" class="${primary ? 'sr-primary' : ''}" ${disabled || state.busy ? 'disabled' : ''}>${text}</button>`;
  function master() { return `<section class="sr-master"><div><div class="sr-row"><strong>配信者音声認識を配信に使う</strong><span class="sr-status" role="status"><span class="sr-dot"></span>${status()}</span></div><small>オンにすると次回のアプリ起動時も自動で開始します。</small></div><label class="sr-switch"><input type="checkbox" id="sr-enabled" ${state.enabled ? 'checked' : ''} ${state.busy ? 'disabled' : ''}><span>${state.enabled ? 'オン' : 'オフ'}</span></label></section>`; }
  function mic() { return `<div class="sr-mic-row"><label class="sr-field" for="sr-microphone">使用するマイク<select id="sr-microphone" ${state.busy ? 'disabled' : ''}>${['Windowsの既定', 'マイク（USB Audio Device）', 'マイク（オーディオインターフェース）'].map(m => `<option ${state.draft.microphone === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>${btn('refresh', '一覧を更新')}</div>`; }
  function model() {
    const labels = { ready: '✓ 準備済み', missing: '未取得', downloading: '取得中 42%', extracting: '展開中', validating: '検証中', failed: '取得失敗' };
    const description = state.model === 'ready' ? '音声はこのPC内で認識します。' : 'sherpa-onnx公式配布元から取得。通信約490 MB・空き容量2 GB以上。';
    return `<div class="sr-model"><div class="sr-model-copy"><span>認識モデル <strong>${labels[state.model]}</strong></span><span>${description}</span></div>${state.model !== 'ready' ? btn('model', state.model === 'missing' ? 'モデルを準備' : state.model === 'failed' ? '取得を再試行' : '準備中…', false, ['downloading','extracting','validating'].includes(state.model)) : ''}</div>`;
  }
  function inputs() { return `<div class="sr-fields">${fields.map(([key,label,technical,min,max,step,help]) => `<label class="sr-field" for="sr-${key}"><span>${label}</span><small>${technical}</small><input id="sr-${key}" data-field="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${esc(state.draft[key])}" aria-invalid="${Boolean(state.errors[key])}" aria-describedby="sr-help-${key}" ${state.busy ? 'disabled' : ''}><span id="sr-help-${key}" class="sr-help" ${state.errors[key] ? 'role="alert"' : ''}>${esc(state.errors[key] || help)}</span></label>`).join('')}</div>`; }
  function apply() { return `<div class="sr-apply"><div><strong id="sr-dirty">${dirty() ? '変更はまだ反映されていません' : '適用済みの設定です'}</strong><small>実行中の認識は、適用後に再起動します。</small></div>${btn('apply', state.busy ? '適用中…' : 'この設定を適用', true, !dirty())}</div>`; }
  function fold(id,title,subtitle,body) { return `<details class="sr-fold" data-fold="${id}" ${state.opened[id] ? 'open' : ''}><summary><div><strong>${title}</strong>${subtitle ? `<small>　${subtitle}</small>` : ''}</div></summary><div class="sr-fold-body">${body}</div></details>`; }
  function tune() { return fold('tune', '認識の調整', 'うまく認識されないときに', inputs()); }
  function preview() {
    const last = state.history.at(-1);
    const body = last ? `<small>${last.time} · 確定した認識結果</small><p>${esc(last.text || '認識結果なし')}</p><small>音声 ${last.audio}秒　／　認識処理 ${last.processing}秒</small>` : `<small>${state.preview ? status() : 'プレビューは停止中'}</small><p>${state.preview ? running() ? '話し終わると、ここに認識結果が表示されます。' : state.scenario === 'microphone' || state.model === 'failed' ? '「要確認」から原因を確認してください。' : '認識の準備ができるまでお待ちください。' : 'まずは、いつもの声で確認。'}</p><small>${state.preview ? '発話中の途中結果は表示しません。' : '「配信に使う」がオフでも、適用済みの設定で確認できます。'}</small>`;
    return `<section class="sr-preview"><div class="sr-preview-head"><div><h2>音声認識プレビュー</h2><small>適用済み：${esc(state.applied.microphone)}</small></div>${btn('preview', state.preview ? 'プレビューを終了' : 'プレビューを開始', !state.preview)}</div><div class="sr-result ${last ? '' : 'sr-empty'}" id="sr-result" aria-live="polite">${body}</div><div class="sr-preview-foot"><span>${state.enabled ? state.preview ? '配信に使う認識結果をプレビューで確認中' : '配信に使う：オン' : '配信に使う：オフ'}</span><span>直近50件・終了時に消去</span></div>${fold('history', `プレビュー履歴（${state.history.length}件）`, '', state.history.length ? `<div class="sr-history">${state.history.slice().reverse().map(h => `<article><time>${h.time}</time><p>${esc(h.text || '認識結果なし')}</p><small>音声 ${h.audio}秒 ／ 認識処理 ${h.processing}秒</small></article>`).join('')}</div>` : '<small>まだプレビュー履歴はありません。</small>')}${fold('wav', '比較用の音声保存', '通常は保存しません', `<label class="sr-check"><input id="sr-wav" type="checkbox" ${state.wav ? 'checked' : ''} ${!state.preview || state.busy ? 'disabled' : ''}>プレビュー中の発話をWAV保存する</label><small>開始するたびにオフへ戻ります。オンにした後の発話だけが対象です。</small>${btn('folder', 'WAV保存先を開く')}`)}</section>`;
  }
  function related() { return fold('obs', 'OBSへの表示・関連機能', '認識結果を配信に使う', `<p>OBSのブラウザソースに「OBS音声認識ビュー」のURLを追加します。</p><code class="sr-url">http://127.0.0.1:3939/overlay/speech-recognition</code><small>見本のURLです。本体では実際の接続先を表示します。「配信に使う」がオンのときだけ、最新の認識結果をOBSに表示します。</small><div class="sr-row">${btn('appearance', '表示の見た目')}${btn('obs-control', 'OBS操作の設定')}</div><small>表示の見た目はOBSコメント表示と共通です。</small>`); }
  function technical() { return fold('technical', 'モデル情報・ライセンス', '', `<p>Parakeet CTC int8 ＋ Silero VAD</p><small>日本語・端末内認識。モデルの選択は不要です。</small>${btn('license', '第三者ライセンスを確認')}`); }
  function variantA() { return `${master()}<section class="sr-block"><h2><span class="sr-number">1</span>マイクを準備</h2>${mic()}${model()}${tune()}${apply()}</section>${preview()}${related()}${technical()}`; }
  function variantB() {
    const stepNames = ['マイクを準備', '話して確認', '配信に使う'];
    const panels = [
      `<div class="sr-step-title"><small>STEP 01 / 03</small><h2>いつものマイクを選びましょう</h2><p class="sr-muted">選んだマイクを適用してから、認識を確認します。</p></div><section class="sr-block">${mic()}${model()}${apply()}</section>${technical()}`,
      `<div class="sr-step-title"><small>STEP 02 / 03</small><h2>短く話して、認識を確認</h2><p class="sr-muted">語頭や語尾、区切られるタイミングを確認します。</p></div>${preview()}${tune()}${apply()}`,
      `<div class="sr-step-title"><small>STEP 03 / 03</small><h2>確認できたら、「配信に使う」をオンに</h2><p class="sr-muted">この切替で、配信者音声認識を開始します。</p></div><div class="sr-ready"><p>マイク：${esc(state.applied.microphone)}</p><p>モデル：${state.model === 'ready' ? '準備済み' : '準備が必要'}</p><p>${state.history.length ? `プレビューで${state.history.length}件の結果を確認` : 'プレビュー結果：未確認'}</p></div>${master()}${related()}`,
    ];
    return `<div class="sr-stepper" aria-label="設定の手順">${stepNames.map((name,i) => `<button type="button" data-step="${i}" aria-pressed="${state.step === i}"><span class="sr-number">${i+1}</span>${name}</button>`).join('')}</div><div class="sr-step-stage">${panels[state.step]}<div class="sr-step-actions">${state.step ? btn('back-step','← 前の手順') : '<span></span>'}${state.step < 2 ? btn('next-step',`${stepNames[state.step+1]} →`,true) : btn('first-step','マイクの設定に戻る')}</div></div>`;
  }
  function variantC() { return `${master()}<div class="sr-workbench"><section class="sr-block"><div><h2>認識の調整</h2><small>値を変える → 適用する → 右側で確認する</small></div>${mic()}${inputs()}${apply()}${model()}</section><div class="sr-stack">${preview()}${related()}</div></div>${technical()}`; }
  function payload() { $('#sr-payload').textContent = JSON.stringify({ ...state, dirty: dirty(), runtime: status(), sessionRequested: requested(), sessionRunning: running() }, null, 2); }
  function chrome() {
    root.querySelectorAll('[data-variant]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.variant === state.variant)));
    $('#sr-variant-label').textContent = `${state.variant} · ${names[state.variant]}`;
    $('#sr-scenario').value = state.scenario;
    $('#sr-warning-count').textContent = issue() ? '1' : '0';
    $('#sr-sample').disabled = !state.preview || !running() || state.busy;
    root.querySelectorAll('[data-page]').forEach(b => { if ((state.page === 'home' ? 'home' : 'settings') === b.dataset.page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    payload();
  }
  function render() {
    const focus = document.activeElement?.id;
    root.querySelectorAll('details[data-fold]').forEach(d => { state.opened[d.dataset.fold] = d.open; });
    if (state.page === 'editor') {
      const backLabel = `${state.origin === 'home' ? 'ホーム' : '設定'}に戻る`;
      $('#sr-main').innerHTML = `<div class="sr-heading sr-editor-heading"><div class="sr-heading-row"><button type="button" id="sr-action-return" class="sr-back" data-action="return" aria-label="${backLabel}" data-tooltip="${backLabel}">←</button><h1>配信者音声認識</h1></div><div class="sr-intro"><span class="sr-intro-mark" aria-hidden="true">◇</span><div><strong>配信者の声を、このPC内で日本語に認識</strong><p>「配信に使う」がオフでも、プレビューで認識結果を確認できます。</p></div></div></div>${({ A: variantA, B: variantB, C: variantC })[state.variant]()}`;
    } else {
      $('#sr-main').innerHTML = `<div class="sr-heading"><h1>${state.page === 'home' ? 'ホーム' : '設定'}</h1><p class="sr-small">配信者音声認識の見本</p></div><section class="sr-master"><div><strong>配信者音声認識</strong><small>${status()}${state.preview ? ' · プレビュー実行中' : ''}${dirty() ? ' · 未適用の変更あり' : ''}</small></div>${btn('open-editor','設定を開く')}</section>`;
    }
    chrome();
    if (focus) { const replacement = document.getElementById(focus); if (replacement && !replacement.disabled) replacement.focus({ preventScroll:true }); }
  }
  function toast(text) {
    clearTimeout(timer); state.toast = text;
    $('#sr-toast').textContent = `✓ ${text}`; $('#sr-toast').hidden = false; $('#sr-toast').setAttribute('data-tooltip', text);
    timer = setTimeout(() => { state.toast = ''; $('#sr-toast').hidden = true; payload(); },4000); payload();
  }
  function switchVariant(value) { state.variant = value; try { const url = new URL(location.href); url.searchParams.set('variant',value); history.replaceState(null,'',url); } catch { /* inline sandbox */ } render(); }
  function validate() {
    const errors = {};
    for (const [key,,,min,max] of fields) {
      const v = state.draft[key];
      if (v === '' || !Number.isFinite(Number(v)) || Number(v) < min || Number(v) > max) errors[key] = `${min}〜${max}の範囲で入力してください。`;
    }
    if (Number(state.draft.maximum) <= Number(state.draft.minimum)) errors.maximum = '最短発話より長くしてください。';
    return errors;
  }
  function prepareModel() {
    state.model = 'downloading'; state.busy = true; render();
    operationTimer = setTimeout(() => { state.model = 'extracting'; render(); operationTimer = setTimeout(() => { state.model = 'validating'; render(); operationTimer = setTimeout(() => { state.model = 'ready'; state.scenario = 'ready'; state.busy = false; render(); toast('モデルの準備完了（見本）'); },250); },250); },400);
  }
  function openDialog(title,body) { $('#sr-dialog-title').textContent = title; $('#sr-dialog-content').innerHTML = body; $('#sr-dialog').showModal(); }
  function refreshDraft() {
    state.errors = validate();
    root.querySelectorAll('[data-field]').forEach(input => {
      const key = input.dataset.field; input.setAttribute('aria-invalid',String(Boolean(state.errors[key])));
      const help = $(`#sr-help-${key}`); help.textContent = state.errors[key] || fields.find(f => f[0] === key)[6];
      if (state.errors[key]) help.setAttribute('role','alert'); else help.removeAttribute('role');
    });
    if ($('#sr-dirty')) $('#sr-dirty').textContent = dirty() ? '変更はまだ反映されていません' : '適用済みの設定です';
    if ($('[data-action="apply"]')) $('[data-action="apply"]').disabled = state.busy || !dirty(); chrome();
  }
  root.addEventListener('input', event => {
    const field = event.target.dataset.field;
    if (!field) return;
    state.draft[field] = event.target.value === '' ? '' : Number(event.target.value); refreshDraft();
  });
  root.addEventListener('change', event => {
    const el = event.target;
    if (el.id === 'sr-microphone') { state.draft.microphone = el.value; refreshDraft(); }
    if (el.id === 'sr-enabled') { state.enabled = el.checked; if (state.enabled && state.model === 'missing') prepareModel(); else render(); toast(`「配信に使う」を${state.enabled ? 'オン' : 'オフ'}にしました（見本）`); }
    if (el.id === 'sr-wav') { state.wav = el.checked; chrome(); }
    if (el.id === 'sr-scenario') {
      clearTimeout(operationTimer); state.busy = false; state.scenario = el.value;
      state.model = ['missing','downloading','failed'].includes(el.value) ? el.value : 'ready'; render();
      if (el.value === 'downloading') prepareModel();
    }
  });
  root.addEventListener('click', event => {
    const button = event.target.closest('button'); if (!button || button.disabled) return;
    if (button.dataset.variant) { switchVariant(button.dataset.variant); return; }
    if (button.dataset.page) { state.page = button.dataset.page; state.origin = state.page; render(); return; }
    if (button.dataset.step !== undefined) { state.step = Number(button.dataset.step); render(); return; }
    if (button.id === 'sr-prev' || button.id === 'sr-next') { switchVariant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+(button.id === 'sr-next' ? 1 : 2))%3]); return; }
    if (button.id === 'sr-close-dialog') { $('#sr-dialog').close(); return; }
    if (button.id === 'sr-warnings') { openDialog('要確認', issue() ? `<p class="sr-error-text">${esc(issue())}</p>${Object.keys(state.errors).length ? btn('close-warning','入力欄に戻る') : btn('retry','原因を解消して再試行（見本）')}` : '<p>現在、要確認事項はありません。</p>'); return; }
    if (button.id === 'sr-sample') {
      state.resultCount++;
      state.history.push({ time: '20:42:' + String(state.resultCount % 60).padStart(2,'0'), text: ['こんばんは。今日はのんびり配信していきます。','マイクの声は、ちゃんと届いていますか？','番号は0086です。'][((state.resultCount-1)%3)], audio:'3.20',processing:'0.48' });
      state.history = state.history.slice(-50); render(); return;
    }
    const action = button.dataset.action;
    if (action === 'open-editor') { state.page = 'editor'; render(); }
    if (action === 'return') { state.page = state.origin; render(); }
    if (action === 'next-step') { state.step++; render(); }
    if (action === 'back-step') { state.step--; render(); }
    if (action === 'first-step') { state.step=0; render(); }
    if (action === 'refresh') toast('マイク一覧を更新しました（見本）');
    if (action === 'apply') {
      state.errors = validate();
      if (Object.keys(state.errors).length) { refreshDraft(); return; }
      state.busy = true; render();
      operationTimer = setTimeout(() => {
        state.busy = false;
        if (state.scenario !== 'save-error') state.applied = { ...state.draft };
        render(); if (state.scenario !== 'save-error') toast('設定を適用しました（見本）');
      },450);
    }
    if (action === 'preview') {
      state.preview = !state.preview; state.wav = false; state.history = [];
      if (state.preview && state.model === 'missing') prepareModel(); else render();
      toast(state.preview ? 'プレビューを開始しました（見本）' : 'プレビューを終了しました（見本）');
    }
    if (action === 'model') prepareModel();
    if (action === 'retry') { $('#sr-dialog').close(); state.scenario = 'ready'; state.model = 'ready'; render(); toast('原因を解消しました。設定は再適用できます（見本）'); }
    if (action === 'close-warning') { $('#sr-dialog').close(); }
    if (action === 'folder') openDialog('WAV保存先', '<p>本体では、プレビュー専用の保存先フォルダーを開きます。</p><small>この見本では音声の取得・ファイル保存は行いません。</small>');
    if (action === 'license') openDialog('モデル情報', '<p>Parakeet CTC int8 ＋ Silero VAD</p><small>本体では、モデルの作者・配布元・ライセンスを記載した第三者ライセンス文書を開きます。</small>');
    if (action === 'appearance') openDialog('表示の見た目', '<p>本体ではOBSコメント表示の基本テーマ設定へ移動します。文字・背景・余白などを共用します。</p>');
    if (action === 'obs-control') openDialog('OBS操作の設定', '<p>本体ではOBS操作の編集画面へ移動します。音声操作フレーズや実行確認を設定します。</p>');
  });
  root.addEventListener('keydown', event => {
    if (!['ArrowLeft','ArrowRight'].includes(event.key) || event.target.closest('input,select,textarea,summary,dialog,[contenteditable=true]')) return;
    event.preventDefault(); switchVariant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+(event.key === 'ArrowRight' ? 1 : 2))%3]);
  });
  render();
  if (globalThis.Tweak) { const tweak = new Tweak({ container:root,onChange:render }); tweak.addSelect(state,'variant',{label:'画面構成',options:Object.entries(names).map(([value,label])=>({ value,label:`${value} · ${label}` }))}); }
})();
</script>
