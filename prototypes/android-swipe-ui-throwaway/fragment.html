</style>
<script>
(() => {
  const root = document.getElementById('cm-android-selected-concept');
  const samples = [
    {name:'はる',initial:'は',service:'YouTube',time:'20:41',text:'夕焼けきれい！今どのあたり？'},
    {name:'mika',initial:'m',service:'Twitch',time:'20:41',text:'音、ちゃんと聞こえてるよ。'},
    {name:'名無し',initial:'名',service:'したらば',time:'20:40',text:'風つよそう。気をつけてね。'},
    {name:'そら',initial:'そ',service:'YouTube',time:'20:40',text:'今日もおつかれさま！'},
    {name:'まめ',initial:'ま',service:'Twitch',time:'20:39',text:'この道の雰囲気好き。'}
  ];
  const ids = ['A'];
  let appearance = 'light';
  const defaults = () => ({registered:true,connected:true,sending:true,broadcast:'live',listening:true,micMuted:false,videoHidden:false,previewClosed:false,screen:'camera',sheet:null,pending:null,network:'tailscale',zoom:1,gain:100,dockExpanded:false,notice:'',follow:true,quality:'720p / 30fps'});
  const states = Object.fromEntries(ids.map(id => [id,defaults()]));
  const timers = {};
  const openers = {};
  const gestures = {};
  const pointers = {};
  const suppressedClicks = {};
  const esc = value => String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const icon = name => '<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const button = (action,label,extra='',iconName='',disabled=false) => '<button type="button" class="cm-button cursor-interaction '+extra+'" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+(iconName?icon(iconName):'')+label+'</button>';
  const routeName = s => ({lan:'LAN',tailscale:'Tailscale',direct:'直接接続'}[s.network]);
  const pcSummary = s => s.registered?'自宅のPC · '+routeName(s)+' · '+(s.connected?'接続済み':'接続待ち'):'PCの共通QRで登録';
  const sendText = s => !s.registered?'未登録':!s.sending?'送信停止中':s.connected?'送信中':'再接続待ち';
  const obsText = s => s.broadcast==='unknown'?'状態不明':s.broadcast==='live'?'配信中':'停止中';
  const readText = s => !s.listening?'停止中':s.connected?'新着を待機中':'再接続待ち';
  const statusbar = () => '<div class="cm-statusbar"><span>20:41</span><span>'+icon('signal')+' '+icon('wifi')+' 82% '+icon('battery-medium')+'</span></div>';
  const head = subtitle => '<header class="cm-header"><div class="cm-brand" aria-hidden="true">c.</div><div class="cm-header-title">きゃすメイト<small>'+subtitle+'</small></div><button type="button" class="cm-icon-btn cursor-interaction" data-action="connection" aria-label="スマホ連携を開く">'+icon('monitor-smartphone')+'</button><button type="button" class="cm-icon-btn cursor-interaction" data-action="settings" aria-label="設定を開く">'+icon('settings-2')+'</button></header>';
  const onboarding = () => statusbar()+'<header class="cm-header"><div class="cm-brand" aria-hidden="true">c.</div><div class="cm-header-title">きゃすメイト<small>QRコードでPCを登録</small></div><button type="button" class="cm-icon-btn cursor-interaction" data-action="theme-toggle" aria-label="'+(appearance==='light'?'ダーク':'ライト')+'モードに切り替える">'+icon(appearance==='light'?'moon':'sun')+'</button></header><main class="cm-onboarding" aria-label="初回のPC登録"><div class="cm-onboarding-mark" aria-hidden="true">'+icon('qr-code')+'</div><h1>PCとつなぐ</h1><p>PC版の「スマホ連携」に表示される<br>QRコードを読み取ります。</p>'+button('qr','PCのQRコードを読み取る','cm-full cm-primary','qr-code')+button('qr-help','QRコードの表示場所','cm-full cm-quiet','monitor-smartphone')+'</main>'+homebar();
  const appearanceControls = () => '<fieldset class="cm-appearance"><legend>配色</legend><div class="cm-theme-options">'+['light','dark'].map(mode=>'<button type="button" class="cm-button cursor-interaction" data-action="theme-'+mode+'" aria-pressed="'+(appearance===mode)+'">'+icon(mode==='light'?'sun':'moon')+(mode==='light'?'ライトモード':'ダークモード')+'</button>').join('')+'</div></fieldset>';
  const connection = s => '<button type="button" class="cm-connection cursor-interaction" data-action="connection"><span><span class="cm-dot"></span>'+(s.registered?'自宅のPC · '+routeName(s):'PCを登録してはじめる')+'</span><span>'+(s.connected?'接続済み':s.registered?'接続待ち':'QRで登録')+' ›</span></button>';
  const chips = s => '<div class="cm-operation-status"><span class="cm-chip">'+icon('radio')+' OBSへの送信 · '+sendText(s)+'</span><span class="cm-chip '+(s.broadcast==='live'?'cm-air':'')+'">OBS配信 · '+obsText(s)+'</span></div>';
  function scene(s,tall=false){
    if(!s.sending || s.videoHidden || s.previewClosed) return '<div class="cm-hidden-camera'+(tall?' cm-tall':'')+'">'+icon(s.sending&&s.videoHidden?'video-off':'camera')+'<strong>'+(!s.sending?'映像・音声はまだ送信していません':s.videoHidden?'カメラ停止中':'プレビューを閉じています')+'</strong><span>'+(!s.sending?'開始するとカメラを表示':s.videoHidden?'代替映像を送信 · マイクは個別に操作':'映像・音声の送信は継続')+'</span>'+(s.sending&&s.previewClosed?button('preview','プレビューを表示','', 'camera'):'')+(tall&&s.sending?quick(s):'')+'</div>';
    return '<div class="cm-scene'+(tall?' cm-tall':'')+'"><div class="cm-scene-top"><span class="cm-scene-tag">背面カメラ · '+s.zoom.toFixed(1)+'×</span><span class="cm-scene-tag">'+(s.connected?'実送信 2.8 Mbps':'実送信 —')+'</span></div><div class="cm-camera-caption">プレビューの見本 · OBS表示未確認</div></div>';
  }
  function comments(s,count=3){
    if(!s.registered || !s.connected)return '<div class="cm-empty">'+icon(s.registered?'wifi-off':'message-circle')+'<strong>'+(s.registered?'コメントの接続を待っています':'コメントを見る準備をしましょう')+'</strong><span>'+(s.registered?'この経路で再接続します':'PCの共通QRを読み取って登録')+'</span>'+(s.registered?button('reload','コメントを再読み込み','', 'rotate-cw'):button('connection','スマホ連携を開く','','qr-code'))+'</div>';
    return '<ul class="cm-comment-list">'+samples.slice(0,count).map(x=>'<li class="cm-comment"><span class="cm-avatar" aria-hidden="true">'+x.initial+'</span><div class="cm-comment-body"><div class="cm-comment-meta"><strong>'+x.name+'</strong><span>'+x.service+'</span><time>'+x.time+'</time></div><p>'+x.text+'</p></div></li>').join('')+'</ul>';
  }
  const commentsHead = s => '<div class="cm-section-head"><h2>コメント</h2><button type="button" class="cm-button cm-quiet cursor-interaction" data-action="follow" aria-pressed="'+s.follow+'">'+(s.follow?'自動スクロール':'自動スクロール停止')+'</button></div>';
  const quick = s => '<div class="cm-quick-controls">'+button('mic',s.micMuted?'ミュート解除':'マイクミュート',s.micMuted?'cm-danger':'',s.micMuted?'mic-off':'mic',!s.sending)+button('video',s.videoHidden?'カメラに戻す':'映像を隠す',s.videoHidden?'cm-danger':'',s.videoHidden?'video-off':'video',!s.sending)+'</div>';
  const meter = s => {const active=s.sending&&!s.micMuted&&s.gain>0;return '<div class="cm-meter-row"><span>'+icon(s.micMuted?'mic-off':'mic')+'</span><div class="cm-meter" role="meter" aria-label="送信マイク音量の見本" aria-valuenow="'+(active?43:0)+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+(active?43:0)+'%"></span></div><span>'+(!s.sending?'停止中':s.micMuted?'ミュート中':s.gain===0?'音量0%':'マイク入力あり')+'</span></div>';};
  const send = s => button('send',s.sending?'映像・音声の送信を停止':'OBSに映像・音声を送信','cm-full '+(s.sending?'':'cm-primary'),s.sending?'square':'radio',!s.registered || (!s.connected&&!s.sending));
  const read = s => button('read',s.listening?'読み上げを停止':'読み上げを聞く','cm-full '+(s.listening?'':'cm-primary'),s.listening?'volume-2':'headphones',!s.registered);
  const obs = s => '<div class="cm-obs-row"><span><strong>OBS配信 · '+obsText(s)+'</strong>自宅のPC</span><button type="button" class="cursor-interaction" data-action="obs"'+(!s.registered||!s.connected||s.broadcast==='unknown'?' disabled':'')+'>OBS配信を'+(s.broadcast==='live'?'終了':'開始')+' ›</button></div>';
  const homebar = () => '<div class="cm-homebar" aria-hidden="true"></div>';
  const notice = s => {const failure=/^(確認の有効期限|画面を離れたため|カメラ権限が必要)/.test(s.notice)?s.notice:'';return failure?'<div class="cm-notice" role="status" aria-live="polite">'+esc(failure)+'</div>':'';};
  const pageNav = s => '<nav class="cm-page-nav" aria-label="機能画面">'+['camera','comments'].map(page=>'<button type="button" class="cursor-interaction" data-action="screen-'+page+'"'+(s.screen===page?' aria-current="page"':'')+'>'+icon(page==='camera'?'camera':'message-circle')+'<span>'+(page==='camera'?'カメラ':'コメント')+'</span></button>').join('')+'</nav>';
  const cameraTitle = s => '<div class="cm-page-title"><h1>カメラ <span>'+sendText(s)+'</span></h1><button type="button" class="cm-icon-btn cursor-interaction" data-action="diagnostics" aria-label="通信の診断">'+icon('activity')+'</button></div>';
  const cameraFoot = s => '<div class="cm-camera-dock">'+send(s)+obs(s)+'</div>'+notice(s)+pageNav(s)+homebar();
  const rail = s => '<div class="cm-camera-rail" data-gesture-ignore><button type="button" class="cm-icon-btn cursor-interaction" data-action="mic" aria-pressed="'+s.micMuted+'" aria-label="'+(s.micMuted?'ミュート解除':'マイクミュート')+'"'+(!s.sending?' disabled':'')+'>'+icon(s.micMuted?'mic-off':'mic')+'<span>マイク</span></button><button type="button" class="cm-icon-btn cursor-interaction" data-action="video" aria-pressed="'+s.videoHidden+'" aria-label="'+(s.videoHidden?'カメラに戻す':'映像を隠す')+'"'+(!s.sending?' disabled':'')+'>'+icon(s.videoHidden?'video':'video-off')+'<span>'+(s.videoHidden?'戻す':'隠す')+'</span></button><button type="button" class="cm-icon-btn cursor-interaction" data-action="settings" aria-label="カメラを調整">'+icon('sliders-horizontal')+'<span>調整</span></button></div>';
  function cameraScreen(s,id){
    const common=statusbar()+head('カメラ · '+pcSummary(s))+cameraTitle(s);
    if(id==='A')return common+'<main class="cm-camera-page" aria-label="カメラ画面"><div class="cm-camera-stage">'+scene(s)+'</div><div class="cm-camera-actions">'+meter(s)+quick(s)+'</div></main>'+cameraFoot(s);
    if(id==='B')return common+'<main class="cm-camera-page" aria-label="カメラ画面"><div class="cm-camera-stage">'+scene(s)+rail(s)+'</div><div class="cm-camera-actions">'+meter(s)+'</div></main>'+cameraFoot(s);
    if(id==='C')return common+'<main class="cm-camera-page" aria-label="カメラ画面"><div class="cm-camera-stage">'+scene(s)+'<section class="cm-camera-tray" data-gesture-ignore aria-label="撮影操作"><button type="button" class="cm-tray-toggle cursor-interaction" data-action="tray" aria-expanded="'+s.dockExpanded+'"><span>'+icon('sliders-horizontal')+' 撮影操作'+(s.micMuted?' · ミュート中':'')+(s.videoHidden?' · 映像非表示':'')+'</span>'+icon(s.dockExpanded?'chevron-down':'chevron-up')+'</button>'+(s.dockExpanded?meter(s)+quick(s)+button('settings','カメラ・音声を調整','cm-full','sliders-horizontal'):'')+'</section></div></main>'+cameraFoot(s);
    return common+'<main class="cm-camera-page" aria-label="カメラ画面"><div class="cm-camera-stage">'+scene(s)+'</div><div class="cm-camera-actions">'+meter(s)+quick(s)+'<div class="cm-two">'+button('settings','カメラ・音声を調整','','sliders-horizontal')+button('diagnostics','通信の診断','','activity')+'</div></div></main>'+cameraFoot(s);
  }
  function commentsScreen(s,id){
    const top=statusbar()+head('コメント · '+pcSummary(s))+'<div class="cm-page-title"><h1>コメント</h1><button type="button" class="cm-button cm-quiet cursor-interaction" data-action="follow" aria-pressed="'+s.follow+'">'+(s.follow?'自動スクロール':'自動スクロール停止')+'</button></div>';
    const status='<div class="cm-reader-state">'+(s.connected?'コメント接続済み · YouTube / Twitch / したらば':'コメントの接続待ち')+'</div>';
    const list='<main class="cm-reader-page" aria-label="コメント画面">'+comments(s,id==='D'?4:5)+'</main>';
    let player='';
    if(id==='B')player='<div class="cm-reader-toolbar">'+icon('headphones')+'<span>コメント読み上げ<small>'+readText(s)+'</small></span>'+read(s)+'</div>';
    else player='<div class="cm-reader-dock">'+(id==='C'?'<div class="cm-player-heading">'+icon('headphones')+'<span>コメント読み上げ<small>'+readText(s)+'</small></span></div>':'')+read(s)+'</div>';
    return top+status+(id==='B'?player:'')+list+(id==='B'?'':player)+notice(s)+pageNav(s)+homebar();
  }
  function connectionSheet(s){return '<div class="cm-sheet-row"><span>登録先PC<small>QRで登録した1台</small></span><strong>'+(s.registered?'自宅のPC':'未登録')+'</strong></div><div class="cm-network-group">'+['lan','tailscale','direct'].map(n=>'<button type="button" class="cm-button cursor-interaction" data-network="'+n+'" aria-pressed="'+(s.network===n)+'"'+(s.sending||!s.registered||n==='direct'?' disabled':'')+'>'+({lan:'LAN',tailscale:'Tailscale',direct:'直接接続'}[n])+'</button>').join('')+'</div>'+(s.sending?'<div class="cm-locked-note">接続経路の変更とQRの読取には、映像・音声の送信停止が必要です。</div>':'<p>登録済みの経路だけ選択できます。直接接続はこの見本では未登録です。</p>')+['コメント','映像・マイク','OBS操作'].map(label=>'<div class="cm-sheet-row"><span>'+label+'</span><span>'+(s.registered?'登録済み · 準備済み':'未登録')+'</span></div>').join('')+'<p>登録後も送信・OBS配信・読み上げは個別に開始します。</p>'+button('qr','PCのQRを読み取る','cm-full cm-primary','qr-code',s.sending)+'<p>直接接続は、PCの鍵を確認して登録します。外出先でQRを得られない場合の復旧は保証されません。</p>';}
  function settingsSheet(s){return '<div class="cm-sheet-row"><span>映像の調整<small>送信中に調整できます</small></span>'+button('preview',s.previewClosed?'プレビュー表示':'プレビューを閉じる','cm-quiet')+'</div><label class="cm-field">ズーム <output>'+s.zoom.toFixed(1)+'×</output><input type="range" data-setting="zoom" min="1" max="4" step="0.1" value="'+s.zoom+'"'+(!s.sending||s.videoHidden?' disabled':'')+'></label><label class="cm-field">配信マイク音量 <output>'+s.gain+'%</output><input type="range" data-setting="gain" min="0" max="200" step="5" value="'+s.gain+'"></label><label class="cm-field">送信品質<select data-setting="quality"'+(s.sending?' disabled':'')+'><option'+(s.quality==='720p / 30fps'?' selected':'')+'>720p / 30fps</option><option'+(s.quality==='1080p / 30fps'?' selected':'')+'>1080p / 30fps</option></select></label><div class="cm-locked-note">'+(s.sending?'送信品質とカメラの向きは、映像・音声の送信を停止してから変更できます。':'品質は次回の送信開始に適用します。')+'</div>'+quick(s)+button('diagnostics','詳しい通信診断','cm-full','activity')+button('connection','スマホ連携を開く','cm-full cm-quiet','monitor-smartphone');}
  function diagnosticsSheet(s){return '<div class="cm-sheet-row"><span>映像</span><strong>'+(!s.sending?'停止中':s.videoHidden?'手動で非表示':'動画を送信中')+'</strong></div><div class="cm-sheet-row"><span>実送信速度</span><strong>'+(s.sending&&s.connected?'2.8 Mbps':'未計測')+'</strong></div><div class="cm-sheet-row"><span>PCの受信</span><strong>'+(s.sending&&s.connected?'受信進行を確認':'未確認')+'</strong></div><div class="cm-sheet-row"><span>OBSでの映像表示</span><strong>未確認</strong></div><div class="cm-sheet-row"><span>選択経路</span><strong>'+routeName(s)+'</strong></div><p>値は見本です。PCの受信とOBSでの表示は別に確認します。</p>'+button('export','数値診断を書き出す','cm-full','download');}
  function sheet(s){
    if(!s.sheet)return '';
    let title='',body='';
    if(s.sheet==='connection'){title='スマホ連携';body=connectionSheet(s);}
    if(s.sheet==='settings'){title=s.screen==='comments'?'コメント・読み上げ':'カメラ・音声';body=s.screen==='comments'?'<div class="cm-sheet-row"><span>コメント表示<small>文字・表示内容はPCの設定を反映</small></span></div>'+button('follow',s.follow?'自動スクロールを停止':'自動スクロールを開始','cm-full','list')+'<div class="cm-sheet-row"><span>読み上げ</span><strong>'+readText(s)+'</strong></div>'+read(s)+button('connection','スマホ連携を開く','cm-full cm-quiet','monitor-smartphone'):settingsSheet(s);}
    if(s.sheet==='diagnostics'){title='通信の診断';body=diagnosticsSheet(s);}
    if(s.sheet==='settings')body=appearanceControls()+body;
    if(s.sheet==='qr-help'){title='QRコードの表示場所';body='<ol class="cm-qr-help"><li>PC版きゃすメイトで「設定」→「スマホ連携」を開きます。</li><li>使うネットワークをONにして、共通QRコードを表示します。</li><li>スマホの「PCのQRコードを読み取る」を押して、PC画面のQRコードを読み取ります。</li></ol>'+button('qr','PCのQRコードを読み取る','cm-full cm-primary','qr-code');}
    if(s.sheet==='send-stop'){title='映像・音声の送信を停止';body='<p>自宅のPCへのカメラ映像と配信マイクの送信を停止します。コメント・読み上げ・OBS配信は継続します。</p>'+button('confirm-send-stop','映像・音声の送信を停止','cm-full cm-danger','square')+button('close','送信を続ける','cm-full cm-quiet');}
    if(s.sheet==='obs-confirm'){title='OBS配信を'+(s.pending?.action==='stop'?'終了':'開始');body='<div class="cm-sheet-row"><span>対象PC</span><strong>自宅のPC</strong></div><div class="cm-sheet-row"><span>現在のOBS状態</span><strong>'+obsText(s)+'</strong></div><p>'+title+'します。映像・音声の送信と読み上げは変更しません。</p><p class="cm-countdown" data-countdown>10秒以内に確認してください。</p>'+button('confirm-obs',title+'する','cm-full '+(s.pending?.action==='stop'?'cm-danger':'cm-primary'),'cast')+button('close','キャンセル','cm-full cm-quiet');}
    if(s.sheet==='controls'){title='送信・OBS操作';body=chips(s)+quick(s)+send(s)+obs(s)+button('camera','映像を見る','cm-full cm-quiet','camera');}
    if(s.sheet==='camera'){title='送信映像';body=scene(s)+quick(s)+meter(s)+button('settings','カメラを調整','cm-full','sliders-horizontal')+button('diagnostics','通信の診断','cm-full cm-quiet','activity');}
    if(s.sheet==='qr'){title='PCの共通QRを読む';body='<div class="cm-empty">'+icon('qr-code')+'<strong>QR読取の操作見本</strong><span>実際のカメラやPCへは接続しません。</span></div><p>カメラ権限が必要です。QRの内容は端末内で処理します。</p>'+button('qr-success','登録成功を試す','cm-full cm-primary')+button('qr-denied','カメラ権限の拒否を試す','cm-full')+'<div class="cm-notice" role="status">'+esc(s.notice)+'</div>';}
    return '<div class="cm-sheet-backdrop"><section class="cm-sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="cm-sheet-handle" aria-hidden="true"></div><div class="cm-sheet-head"><h2>'+title+'</h2><button type="button" class="cm-icon-btn cursor-interaction" data-action="close" aria-label="閉じる">'+icon('x')+'</button></div>'+body+'</section></div>';
  }
  function refreshIcons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
  function saveHost(){const data={modelContent:{androidSwipeUiMockup:{scenario:root.querySelector('#cm-scenario').value,appearance}},privateContent:{version:3,states,appearance}};if(window.openai?.setWidgetState)window.openai.setWidgetState(data)?.catch(()=>{});}
  function render(id){
    const phone = root.querySelector('[data-phone="'+id+'"]');
    const s = states[id];
    phone.style.colorScheme=appearance;
    phone.dataset.appearance=appearance;
    const focused = document.activeElement;
    const focusAction = phone.contains(focused)?focused?.dataset.action:null;
    const focusNetwork = phone.contains(focused)?focused?.dataset.network:null;
    delete gestures[id];
    const content=!s.registered?onboarding():s.screen==='comments'?commentsScreen(s,id):cameraScreen(s,id);
    phone.innerHTML='<div class="cm-product-layer"'+(s.sheet?' inert':'')+'>'+content+'</div>'+sheet(s);
    root.querySelector('#cm-payload').textContent=JSON.stringify(states,null,2);
    const activeRegion=s.sheet?phone.querySelector('.cm-sheet'):phone;
    const restoreAction=!s.sheet&&openers[id]?openers[id]:focusAction;
    const restore = (restoreAction?activeRegion.querySelector('[data-action="'+restoreAction+'"]'):focusNetwork?activeRegion.querySelector('[data-network="'+focusNetwork+'"]'):null) || (s.sheet?activeRegion.querySelector('[data-action="close"]'):null);
    if(restore&&!restore.disabled)restore.focus({preventScroll:true});
    if(!s.sheet)delete openers[id];
    refreshIcons();
  }
  function clearPending(id){if(timers[id])clearInterval(timers[id]);delete timers[id];states[id].pending=null;}
  function expireConfirmation(id){const s=states[id];clearPending(id);if(s.sheet==='obs-confirm')s.sheet=null;s.notice='確認の有効期限が切れました。もう一度OBS状態を確認して操作してください。';render(id);}
  function startConfirmation(id){const s=states[id];clearPending(id);s.pending={action:s.broadcast==='live'?'stop':'start',expiresAt:Date.now()+10000};s.sheet='obs-confirm';timers[id]=setInterval(()=>{if(!s.pending)return;const seconds=Math.max(0,Math.ceil((s.pending.expiresAt-Date.now())/1000));if(!seconds){expireConfirmation(id);return;}const label=root.querySelector('[data-phone="'+id+'"] [data-countdown]');if(label)label.textContent=seconds+'秒以内に確認してください。';},250);}
  function changeSheet(id,newSheet){clearPending(id);states[id].sheet=newSheet;}
  function switchScreen(id,screen){
    if(!states[id]?.registered||!['camera','comments'].includes(screen)||screen===states[id].screen)return;
    clearPending(id);delete openers[id];states[id].sheet=null;states[id].screen=screen;states[id].notice='';render(id);saveHost();
    root.querySelector('[data-phone="'+id+'"] .cm-page-nav [aria-current="page"]')?.focus({preventScroll:true});
  }
  function act(id,action){
    const s=states[id];
    if(['theme-light','theme-dark','theme-toggle'].includes(action)){appearance=action==='theme-toggle'?(appearance==='light'?'dark':'light'):action==='theme-dark'?'dark':'light';for(const phoneId of ids)render(phoneId);saveHost();return;}
    if(!s.sheet&&['connection','settings','diagnostics','controls','camera','send','obs','qr','qr-help'].includes(action))openers[id]=action;
    if(action==='send'){if(s.sending)changeSheet(id,'send-stop');else if(s.registered&&s.connected){s.sending=true;s.videoHidden=false;s.micMuted=false;s.zoom=1;s.previewClosed=false;s.notice='映像・音声の送信を開始しました。OBS配信は別操作です。';}}
    if(action==='confirm-send-stop'&&s.sheet==='send-stop'){s.sending=false;s.sheet=null;s.notice='映像・音声の送信を停止しました。';}
    if(action==='read'&&s.registered){s.listening=!s.listening;s.notice=s.listening?'新着コメントの読み上げを待機しています。':'読み上げを停止しました。';}
    if(action==='mic'&&s.sending){s.micMuted=!s.micMuted;s.notice=s.micMuted?'配信マイクをミュートしました。':'配信マイクのミュートを解除しました。';}
    if(action==='video'&&s.sending){s.videoHidden=!s.videoHidden;if(!s.videoHidden)s.zoom=1;s.notice=s.videoHidden?'カメラを停止し、代替映像を送信します。':'カメラ映像へ戻しました。';}
    if(action==='preview'){s.previewClosed=!s.previewClosed;s.notice='プレビューの表示だけを変更しました。';}
    if(action==='obs'&&s.registered&&s.connected&&s.broadcast!=='unknown')startConfirmation(id);
    if(action==='confirm-obs'&&s.pending&&s.connected&&Date.now()<s.pending.expiresAt){s.broadcast=s.pending.action==='stop'?'stopped':'live';clearPending(id);s.sheet=null;s.notice='OBS配信を'+(s.broadcast==='live'?'開始':'終了')+'しました（操作見本）。';}
    if(action==='close'){clearPending(id);s.sheet=null;}
    if(['connection','settings','diagnostics','controls','camera','qr-help'].includes(action))changeSheet(id,action);
    if(action==='screen-comments'||action==='screen-camera'){switchScreen(id,action==='screen-comments'?'comments':'camera');return;}
    if(action==='comments'||action==='main'){switchScreen(id,action==='comments'?'comments':'camera');return;}
    if(action==='tray')s.dockExpanded=!s.dockExpanded;
    if(action==='follow')s.follow=!s.follow;
    if(action==='reload')s.notice='コメント表示の再読込だけを試しました。';
    if(action==='export')s.notice='数値診断の書き出しを試しました。実ファイルは生成しません。';
    if(action==='qr'&&!s.sending)changeSheet(id,'qr');
    if(action==='qr-denied'){s.notice='カメラ権限が必要です。アプリ設定で許可してください。';}
    if(action==='qr-success'&&!s.sending){const wasRegistered=s.registered;s.registered=true;s.connected=true;if(!wasRegistered){s.network='tailscale';s.broadcast='stopped';s.screen='camera';}s.sheet=wasRegistered?'connection':null;s.notice=wasRegistered?'登録情報を更新しました。開始済みの機能は継続します。':'';}
    render(id);saveHost();
  }
  root.addEventListener('click',event=>{const backdrop=event.target.closest('.cm-sheet-backdrop');if(backdrop&&event.target===backdrop){act(backdrop.closest('[data-phone]').dataset.phone,'close');return;}const target=event.target.closest('button');if(!target||target.disabled||target.closest('[inert]'))return;const phone=target.closest('[data-phone]');if(!phone)return;const id=phone.dataset.phone;if(target.dataset.action)act(id,target.dataset.action);else if(target.dataset.network&&!states[id].sending&&states[id].registered&&target.dataset.network!=='direct'){states[id].network=target.dataset.network;states[id].notice='登録済みの'+routeName(states[id])+'を選択しました。';render(id);saveHost();}});
  root.addEventListener('keydown',event=>{const phone=event.target.closest('[data-phone]');if(!phone)return;const modal=phone.querySelector('.cm-sheet');if(!modal)return;if(event.key==='Escape'){event.preventDefault();act(phone.dataset.phone,'close');return;}if(event.key==='Tab'){const list=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled])')];const first=list[0],last=list[list.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
  root.addEventListener('input',event=>{const input=event.target;const phone=input.closest('[data-phone]');if(!phone||!input.dataset.setting||input.disabled)return;const s=states[phone.dataset.phone];const prop=input.dataset.setting;s[prop]=prop==='quality'?input.value:Number(input.value);const label=input.closest('label');const output=label?.querySelector('output');if(output)output.textContent=prop==='zoom'?s.zoom.toFixed(1)+'×':s.gain+'%';root.querySelector('#cm-payload').textContent=JSON.stringify(states,null,2);saveHost();});
  root.addEventListener('pointerdown',event=>{
    const phone=event.target.closest('[data-phone]');if(!phone)return;event.stopPropagation();const id=phone.dataset.phone;
    const active=pointers[id]||(pointers[id]=new Set());active.add(event.pointerId);
    if(active.size>1||event.isPrimary===false){delete gestures[id];return;}
    if(states[id].sheet||event.target.closest('button,input,select,textarea,a,[contenteditable],.cm-sheet-backdrop,[data-gesture-ignore]')||event.button>0)return;
    gestures[id]={pointerId:event.pointerId,x:event.clientX,y:event.clientY,at:Date.now()};
    try{phone.setPointerCapture?.(event.pointerId);}catch{/* Synthetic pointers do not own capture. */}
  });
  root.addEventListener('pointermove',event=>{const phone=event.target.closest('[data-phone]');if(!phone)return;event.stopPropagation();const g=gestures[phone.dataset.phone];if(g&&g.pointerId===event.pointerId&&Math.abs(event.clientX-g.x)>1.5*Math.abs(event.clientY-g.y)&&event.cancelable)event.preventDefault();});
  root.addEventListener('pointerup',event=>{
    const phone=event.target.closest('[data-phone]');if(!phone)return;event.stopPropagation();const id=phone.dataset.phone;const g=gestures[id];pointers[id]?.delete(event.pointerId);delete gestures[id];
    if(!g||g.pointerId!==event.pointerId||states[id].sheet)return;
    const dx=event.clientX-g.x,dy=event.clientY-g.y;
    if(Math.abs(dx)<56||Math.abs(dx)<=1.5*Math.abs(dy)||Date.now()-g.at>700)return;
    suppressedClicks[id]=Date.now()+350;switchScreen(id,dx<0?'comments':'camera');
  });
  root.addEventListener('pointercancel',event=>{const phone=event.target.closest('[data-phone]');if(phone){event.stopPropagation();pointers[phone.dataset.phone]?.delete(event.pointerId);delete gestures[phone.dataset.phone];}});
  const resetGesture = id => {delete gestures[id];pointers[id]?.clear();delete suppressedClicks[id];};
  document.addEventListener('pointerup',event=>{const targetPhone=event.target.closest('[data-phone]');for(const id of ids){pointers[id]?.delete(event.pointerId);if(gestures[id]?.pointerId===event.pointerId&&targetPhone?.dataset.phone!==id)delete gestures[id];}},true);
  document.addEventListener('pointercancel',event=>{for(const id of ids){pointers[id]?.delete(event.pointerId);if(gestures[id]?.pointerId===event.pointerId)delete gestures[id];}},true);
  window.addEventListener('blur',()=>{for(const id of ids)resetGesture(id);});
  root.addEventListener('click',event=>{const phone=event.target.closest('[data-phone]');if(phone&&event.detail>0&&suppressedClicks[phone.dataset.phone]>Date.now()){delete suppressedClicks[phone.dataset.phone];event.preventDefault();event.stopImmediatePropagation();}},true);
  root.addEventListener('keydown',event=>{const phone=event.target.closest('[data-phone]');if(!phone||states[phone.dataset.phone].sheet||event.target.closest('input,select,textarea,[contenteditable]')||(event.target.closest('button')&&!event.target.closest('.cm-page-nav')))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();event.stopPropagation();switchScreen(phone.dataset.phone,event.key==='ArrowLeft'?'comments':'camera');}});
  function setScenario(value){
    if(!['running','ready','offline','unregistered'].includes(value))return;
    root.querySelector('#cm-scenario').value=value;
    for(const id of ids){clearPending(id);states[id]=defaults();const s=states[id];if(value==='ready'){s.sending=false;s.broadcast='stopped';s.listening=false;}if(value==='offline'){s.connected=false;s.broadcast='unknown';}if(value==='unregistered'){s.registered=false;s.connected=false;s.sending=false;s.broadcast='unknown';s.listening=false;}render(id);}
  }
  root.querySelector('#cm-scenario').addEventListener('change',event=>{setScenario(event.target.value);saveHost();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const id of ids){resetGesture(id);const s=states[id];if(s.pending){clearPending(id);s.sheet=null;s.notice='画面を離れたため、OBS配信の確認を取り消しました。';render(id);}}});
  const variantObserver=new MutationObserver(records=>{for(const record of records){const id=record.target.dataset.design;if(record.target.hidden){resetGesture(id);if(states[id]?.pending){clearPending(id);states[id].sheet=null;states[id].notice='画面を離れたため、OBS配信の確認を取り消しました。';render(id);}}}});
  for(const section of root.querySelectorAll('[data-design]'))variantObserver.observe(section,{attributes:true,attributeFilter:['hidden']});
  function hydrate(data){if(data?.privateContent?.version!==3||!data.privateContent.states)return;appearance=data.privateContent.appearance==='dark'?'dark':'light';for(const id of ids){const saved=data.privateContent.states[id];if(!saved||typeof saved.registered!=='boolean')continue;states[id]={...defaults(),...saved,screen:saved.registered&&['camera','comments'].includes(saved.screen)?saved.screen:'camera',pending:null,sheet:null};render(id);}const scenario=data.modelContent?.androidSwipeUiMockup?.scenario;if(['running','ready','offline','unregistered'].includes(scenario))root.querySelector('#cm-scenario').value=scenario;}
  setScenario('unregistered');
  hydrate(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>hydrate(event.detail?.globals?.widgetState));
  if(globalThis.Tweak){for(const id of ids){const phone=root.querySelector('[data-phone="'+id+'"]');const design={radius:28};new Tweak({container:phone,onChange:()=>phone.style.borderRadius=design.radius+'px'}).addSlider(design,'radius',{label:'画面の角丸',min:0,max:32,unit:'px'});}}
  window.casmatePrototype={getState:id=>structuredClone(states[id]),setScenario,expireConfirmation,switchScreen};
})();
</script>
