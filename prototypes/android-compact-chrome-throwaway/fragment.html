<!-- Throwaway: three compact header/footer layouts and the adopted reference. All state is fictional and local. -->
<div id="cm-compact-chrome">
  <div class="qc-tools"><span>カメラ・コメントの表示面積</span><label>見本の場面 <select data-scenario><option value="running">配信中</option><option value="offline">通信断</option><option value="ready">開始前</option></select></label></div>
  <div class="viz-carousel viz-dotted-background" aria-label="ヘッダーとフッターの改善案" data-previous-label="前の案" data-next-label="次の案">
    <section data-variant="一段ヘッダー" data-design="A" aria-label="一段ヘッダー案"><div class="qc-stage"><div class="qc-phone" data-phone="A" aria-label="一段ヘッダーの操作見本"></div><div class="qc-measure" data-measure="A"></div></div></section>
    <section data-variant="操作とタブをまとめる" data-design="B" aria-label="操作とタブをまとめる案" hidden><div class="qc-stage"><div class="qc-phone" data-phone="B" aria-label="操作とタブをまとめる操作見本"></div><div class="qc-measure" data-measure="B"></div></div></section>
    <section data-variant="切替を上部へ" data-design="C" aria-label="切替を上部へ移す案" hidden><div class="qc-stage"><div class="qc-phone" data-phone="C" aria-label="切替を上部へ移す操作見本"></div><div class="qc-measure" data-measure="C"></div></div></section>
    <section data-variant="現在の見本" data-design="R" aria-label="現在の見本との比較" hidden><div class="qc-stage"><div class="qc-phone" data-phone="R" aria-label="現在の見本の配置"></div><div class="qc-measure" data-measure="R"></div></div></section>
  </div>
  <details class="qc-state"><summary>見本の状態</summary><pre data-payload></pre></details>
</div>
<style>
  #cm-compact-chrome{color-scheme:light dark;--qc-bg:light-dark(#f5f7f4,#151b19);--qc-surface:light-dark(#fff,#212a26);--qc-text:light-dark(#1d3029,#e9f2ec);--qc-muted:light-dark(#52685c,#b5c6bb);--qc-line:light-dark(#d9e3db,#3a4b40);--qc-soft:light-dark(#eaf1e9,#293d30);--qc-accent:light-dark(#236245,#b6e9cb);--qc-on:light-dark(#fff,#163022);--qc-danger:light-dark(#a13535,#ffb4ab);font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;font-size:14px;line-height:1.5}
  #cm-compact-chrome[data-appearance=light]{color-scheme:light}#cm-compact-chrome[data-appearance=dark]{color-scheme:dark}
  #cm-compact-chrome *{box-sizing:border-box}#cm-compact-chrome [hidden]{display:none!important}
  #cm-compact-chrome button,#cm-compact-chrome select{font:inherit;color:inherit}#cm-compact-chrome button{cursor:inherit}
  #cm-compact-chrome .qc-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 16px;color:var(--qc-muted)}
  #cm-compact-chrome .qc-tools label{display:flex;align-items:center;gap:8px}#cm-compact-chrome select{min-height:48px;border:1px solid var(--qc-line);background:var(--qc-surface);border-radius:10px;padding:8px}
  #cm-compact-chrome .qc-stage{min-height:914px;display:flex;flex-direction:column;align-items:center;padding:20px 10px 12px;gap:16px}
  #cm-compact-chrome .qc-phone{position:relative;width:100%;max-width:398px;height:820px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--qc-line);border-radius:28px;background:var(--qc-bg);color:var(--qc-text);font-size:calc(14px * var(--qc-scale,1));box-shadow:0 16px 44px light-dark(#21352b16,#0005)}
  #cm-compact-chrome .qc-statusbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:24px;padding:0 22px;font-size:.8em}
  #cm-compact-chrome .qc-header{display:flex;align-items:center;flex-shrink:0;gap:4px;padding:0 8px;min-height:56px}
  #cm-compact-chrome .qc-logo{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:var(--qc-accent);color:var(--qc-on);font-weight:500}
  #cm-compact-chrome .qc-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:1.14em;font-weight:500}
  #cm-compact-chrome .qc-chip{font-size:.75em;color:var(--qc-muted);font-weight:400;white-space:nowrap}
  #cm-compact-chrome .qc-icon{width:48px;min-height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:12px;padding:0;position:relative;color:var(--qc-accent)}
  #cm-compact-chrome svg{width:18px;height:18px;flex-shrink:0}
  #cm-compact-chrome .qc-dot{width:6px;height:6px;border-radius:50%;background:var(--qc-accent);position:absolute;right:11px;top:9px}
  #cm-compact-chrome .qc-dot.qc-off{background:var(--qc-danger)}
  #cm-compact-chrome .qc-tabs{display:flex;gap:4px;min-width:0}
  #cm-compact-chrome .qc-tabs button{flex:1;min-width:0;min-height:48px;padding:8px;border:0;border-radius:12px;color:var(--qc-muted);background:transparent;white-space:normal}
  #cm-compact-chrome .qc-tabs button[aria-selected=true]{background:var(--qc-soft);color:var(--qc-accent);font-weight:500}
  #cm-compact-chrome .qc-header .qc-tabs{flex:1}
  #cm-compact-chrome .qc-main{display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;padding:4px 12px 8px;gap:8px;touch-action:pan-y}
  #cm-compact-chrome .qc-preview{min-height:150px;flex:1;position:relative;overflow:hidden;border-radius:18px;background:var(--qc-soft);color:var(--qc-text);display:flex;align-items:center;justify-content:center}
  #cm-compact-chrome .qc-landscape{position:absolute;inset:0;background:linear-gradient(174deg,light-dark(#90b1b8,#47666a),light-dark(#ccd6bb,#6c8262) 51%,light-dark(#849673,#425b3e) 52%)}
  #cm-compact-chrome .qc-mountain{position:absolute;inset:38% -12% -8%;background:light-dark(#688266,#334b37);clip-path:polygon(0 40%,24% 8%,53% 47%,73% 18%,100% 50%,100% 100%,0 100%)}
  #cm-compact-chrome .qc-path{position:absolute;inset:48% 10% -5%;background:light-dark(#d7d0b3,#a79f7d);clip-path:polygon(38% 0,53% 0,83% 100%,3% 100%,49% 36%)}
  #cm-compact-chrome .qc-badge{position:absolute;left:10px;top:10px;padding:4px 8px;border-radius:8px;font-size:.85em;background:var(--qc-surface);color:var(--qc-text)}
  #cm-compact-chrome .qc-badge.qc-rate{right:10px;left:auto}
  #cm-compact-chrome .qc-preview-label{position:absolute;bottom:10px;left:10px;padding:4px 8px;border-radius:8px;background:var(--qc-surface);font-size:.8em}
  #cm-compact-chrome .qc-meter{display:flex;align-items:center;gap:8px;min-height:24px;color:var(--qc-muted);font-size:.8em}
  #cm-compact-chrome .qc-track{height:4px;flex:1;min-width:0;border-radius:4px;background:var(--qc-line);overflow:hidden}#cm-compact-chrome .qc-track span{display:block;height:100%;width:43%;background:var(--qc-accent)}
  #cm-compact-chrome .qc-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #cm-compact-chrome .qc-button{min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--qc-line);padding:8px;border-radius:12px;background:var(--qc-surface);color:var(--qc-text);font-size:.93em;white-space:normal;min-width:0}
  #cm-compact-chrome .qc-button.qc-primary{background:var(--qc-accent);color:var(--qc-on);border-color:var(--qc-accent)}
  #cm-compact-chrome .qc-button[aria-pressed=true]{background:var(--qc-soft);color:var(--qc-accent)}
  #cm-compact-chrome button:disabled{opacity:.5;cursor:not-allowed}
  #cm-compact-chrome .qc-camera-state{height:24px;display:flex;align-items:center;font-size:.8em;color:var(--qc-muted)}
  #cm-compact-chrome .qc-footer{flex-shrink:0;background:var(--qc-surface);border-top:1px solid var(--qc-line);padding:4px 8px}
  #cm-compact-chrome .qc-footer>.qc-button{width:100%}
  #cm-compact-chrome .qc-footer .qc-nav-row{display:flex;gap:6px;align-items:stretch;padding:4px 0}
  #cm-compact-chrome .qc-footer .qc-nav-row>.qc-tabs{flex:1}
  #cm-compact-chrome .qc-footer .qc-nav-row>.qc-button{flex:0 1 42%}
  #cm-compact-chrome .qc-obs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:8px;min-height:48px;font-size:.85em}
  #cm-compact-chrome .qc-obs span{flex:1;min-width:0;color:var(--qc-muted)}
  #cm-compact-chrome .qc-obs small{display:block;font:inherit}
  #cm-compact-chrome .qc-obs button{min-height:48px;padding:8px;background:transparent;border:0;color:var(--qc-danger);border-radius:10px}
  #cm-compact-chrome .qc-read{width:100%}
  #cm-compact-chrome .qc-read-status{font-size:.85em;color:var(--qc-muted);min-height:32px}
  #cm-compact-chrome .qc-home{height:14px;flex-shrink:0;display:flex;justify-content:center;align-items:center;background:var(--qc-surface)}#cm-compact-chrome .qc-home span{width:92px;height:4px;border-radius:4px;background:var(--qc-text)}
  #cm-compact-chrome .qc-comments{display:block;padding:0 16px;scrollbar-width:thin}
  #cm-compact-chrome .qc-comment{display:flex;gap:10px;padding:16px 0;border-bottom:1px solid var(--qc-line)}
  #cm-compact-chrome .qc-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--qc-soft);color:var(--qc-accent);display:grid;place-items:center}
  #cm-compact-chrome .qc-comment-content{flex:1;min-width:0;overflow-wrap:anywhere}
  #cm-compact-chrome .qc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--qc-muted);font-size:.85em}#cm-compact-chrome .qc-meta strong{color:var(--qc-text);font-weight:500}#cm-compact-chrome .qc-meta time{margin-left:auto}
  #cm-compact-chrome .qc-comment p{margin:4px 0 0;font-size:1.07em}
  #cm-compact-chrome .qc-current .qc-header{padding:8px 16px 10px;min-height:82px;gap:8px}
  #cm-compact-chrome .qc-current .qc-logo{width:36px;height:36px}
  #cm-compact-chrome .qc-current .qc-title{display:block}#cm-compact-chrome .qc-title small{display:block;font-weight:400;font-size:.7em;color:var(--qc-muted)}
  #cm-compact-chrome .qc-page-heading{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:48px;flex-shrink:0;font-weight:500}
  #cm-compact-chrome .qc-current .qc-footer{padding:12px 16px}
  #cm-compact-chrome .qc-current .qc-footer>.qc-button{min-height:56px}
  #cm-compact-chrome .qc-current .qc-obs{min-height:72px}
  #cm-compact-chrome .qc-current .qc-tabs{padding-top:8px;gap:8px}#cm-compact-chrome .qc-current .qc-tabs button{min-height:56px}
  #cm-compact-chrome .qc-measure{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:var(--qc-muted);font-size:12px;min-height:36px;align-items:center}
  #cm-compact-chrome .qc-overlay{position:absolute;inset:0;background:light-dark(#1d302966,#0009);z-index:10;display:flex;align-items:flex-end;padding:10px}
  #cm-compact-chrome .qc-sheet{width:100%;max-height:90%;overflow:auto;background:var(--qc-surface);border:1px solid var(--qc-line);border-radius:20px;padding:18px;color:var(--qc-text)}
  #cm-compact-chrome .qc-sheet h2{font-size:1.14em;font-weight:500;margin:0 0 12px}#cm-compact-chrome .qc-sheet p{margin:0 0 14px;overflow-wrap:anywhere}
  #cm-compact-chrome .qc-sheet .qc-two{margin:12px 0}
  #cm-compact-chrome .qc-state{margin-top:12px;color:var(--qc-muted)}#cm-compact-chrome .qc-state pre{white-space:pre-wrap;overflow-wrap:anywhere}
  #cm-compact-chrome[data-large-text=true] .qc-header .qc-logo{display:none}
  #cm-compact-chrome[data-large-text=true] .qc-title{flex-direction:column;align-items:flex-start;gap:0}
  #cm-compact-chrome[data-large-text=true] .qc-chip{white-space:normal}
  #cm-compact-chrome[data-large-text=true] .qc-badge{max-width:calc(100% - 20px)}
  #cm-compact-chrome[data-large-text=true] .qc-badge.qc-rate{top:90px}
  #cm-compact-chrome[data-large-text=true] .qc-preview-label{display:none}
  #cm-compact-chrome .qc-preview-label{max-width:calc(100% - 20px);overflow-wrap:anywhere}
  #cm-compact-chrome[data-large-text=true] .qc-camera-state{height:64px;flex-shrink:0}
  #cm-compact-chrome .qc-header .qc-tabs button{overflow-wrap:anywhere}
  @media(max-width:370px){#cm-compact-chrome .qc-current .qc-header{padding-left:10px;padding-right:10px}#cm-compact-chrome .qc-current .qc-title small{font-size:.68em}#cm-compact-chrome .qc-title{gap:4px}#cm-compact-chrome .qc-header .qc-logo{display:none}}
</style>
<script>
(() => {
  const root=document.getElementById('cm-compact-chrome');
  const saved=window.openai?.widgetState?.modelContent?.compactChrome;
  const state={page:'camera',appearance:'light',connected:true,sending:true,listening:true,mute:false,video:true,broadcast:true,scale:1};
  function restore(value){if(!value||typeof value!=='object')return;for(const key of ['sending','listening','mute','video','broadcast','connected'])if(typeof value[key]==='boolean')state[key]=value[key];if(['camera','comments'].includes(value.page))state.page=value.page;if(['light','dark'].includes(value.appearance))state.appearance=value.appearance;if([1,2].includes(value.scale))state.scale=value.scale;}
  restore(saved);
  let modal=null,focusReturn=null;
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const comments=[['は','はる','YouTube','夕焼けきれい！今どのあたり？','20:41'],['m','mika','Twitch','音、ちゃんと聞こえてるよ。','20:41'],['名','名無し','したらば','風つよそう。気をつけてね。','20:40'],['そ','そら','YouTube','今日もおつかれさま！','20:40'],['ま','まめ','Twitch','この道の雰囲気好き。','20:39'],['ゆ','ゆう','YouTube','もうすぐ日が沈みそうだね。','20:39'],['k','kuma','Twitch','映像も音も大丈夫です。','20:38'],['な','なつ','YouTube','あたたかい色でいいね。','20:38']];
  function tabs(){return `<nav class="qc-tabs" aria-label="機能画面">${[['camera','カメラ'],['comments','コメント']].map(([p,label])=>`<button type="button" class="cursor-interaction" role="tab" aria-selected="${state.page===p}" data-action="page" data-page="${p}">${label}</button>`).join('')}</nav>`;}
  function action(short=false){return `<button type="button" class="qc-button cursor-interaction ${state.page==='comments'?'qc-primary qc-read':''}" data-action="${state.page==='camera'?'send':'read'}">${icon(state.page==='camera'?'square':'headphones')}${state.page==='camera'?(state.sending?(short?'送信停止':'映像・音声の送信を停止'):(short?'送信開始':'OBSに映像・音声を送信')):(state.listening?(short?'読み上げ停止':'読み上げを停止'):(short?'読み上げ開始':'読み上げを聞く'))}</button>`;}
  function obs(){return `<div class="qc-obs"><span>OBS配信<small>${!state.connected?'状態不明':state.broadcast?'配信中':'停止中'}</small></span><button type="button" class="cursor-interaction" data-action="obs" ${!state.connected?'disabled':''}>${state.broadcast?'OBS配信を終了':'OBS配信を開始'}</button></div>`;}
  function header(id){const connection=`<button type="button" class="qc-icon cursor-interaction" aria-label="スマホ連携・${state.connected?'接続済み':'接続待ち'}" data-action="connection">${icon('monitor-smartphone')}<span class="qc-dot ${state.connected?'':'qc-off'}"></span></button>`;const settings=`<button type="button" class="qc-icon cursor-interaction" aria-label="${state.page==='camera'?'カメラ':'コメント'}設定" data-action="settings">${icon('settings-2')}</button>`;return `<header class="qc-header">${id==='C'?tabs():`<span class="qc-logo">C.</span><div class="qc-title">${id==='R'?`きゃすメイト<small>自宅のPC · Tailscale · ${state.connected?'接続済み':'接続待ち'}</small>`:`${state.page==='camera'?'カメラ':'コメント'}<span class="qc-chip">${state.page==='camera'?(state.connected?(state.sending?'送信中':'停止中'):'再接続待ち'):'自動スクロール'}</span>`}</div>`}${connection}${settings}</header>${id==='R'?`<div class="qc-page-heading"><span>${state.page==='camera'?'カメラ':'コメント'}</span><span class="qc-chip">${state.page==='camera'?(state.connected?'送信中':'再接続待ち'):'自動スクロール'}</span></div>`:''}`;}
  function body(){if(state.page==='comments')return `<main class="qc-main qc-comments" aria-label="コメント一覧">${comments.map(([a,n,s,t,time])=>`<article class="qc-comment"><span class="qc-avatar">${a}</span><div class="qc-comment-content"><div class="qc-meta"><strong>${n}</strong><span>${s}</span><time>${time}</time></div><p>${t}</p></div></article>`).join('')}</main>`;return `<main class="qc-main" aria-label="カメラプレビュー"><div class="qc-preview">${state.video?'<div class="qc-landscape"><div class="qc-mountain"></div><div class="qc-path"></div></div>':'<span>カメラ停止中</span>'}<span class="qc-badge">背面カメラ · 1.0×</span><span class="qc-badge qc-rate">${state.connected&&state.sending?'2.8 Mbps':'—'}</span><span class="qc-preview-label">プレビューの見本 · OBS表示未確認</span></div><div class="qc-meter"><div class="qc-track"><span style="width:${state.mute||!state.sending?'0':'43'}%"></span></div><span>${state.mute?'ミュート中':state.sending?'マイク入力あり':'マイク停止中'}</span></div><div class="qc-two"><button type="button" class="qc-button cursor-interaction" data-action="mic" aria-pressed="${state.mute}" ${state.sending?'':'disabled'}>${icon(state.mute?'mic-off':'mic')}${state.mute?'ミュート解除':'マイクミュート'}</button><button type="button" class="qc-button cursor-interaction" data-action="video" aria-pressed="${!state.video}" ${state.sending?'':'disabled'}>${icon(state.video?'video':'video-off')}${state.video?'映像を隠す':'カメラに戻す'}</button></div><div class="qc-camera-state">${state.connected?'OBS表示未確認':'再接続待ち · OBS状態不明'}</div></main>`;}
  function footer(id){if(id==='B')return `<footer class="qc-footer">${state.page==='camera'?obs():''}<div class="qc-nav-row">${tabs()}${action(true)}</div></footer>`;return `<footer class="qc-footer">${id==='R'&&state.page==='comments'?`<div class="qc-read-status">読み上げ：${state.listening?'待機中':'停止中'}</div>`:''}${action()}${state.page==='camera'?obs():''}${id==='C'?'':tabs()}</footer>`;}
  function sheet(){if(!modal)return '';let content='';if(modal==='settings')content=`<h2>${state.page==='camera'?'カメラ':'コメント'}設定</h2><p>配色</p><div class="qc-two"><button class="qc-button cursor-interaction" type="button" data-action="theme" data-theme="light" aria-pressed="${state.appearance==='light'}">ライトモード</button><button class="qc-button cursor-interaction" type="button" data-action="theme" data-theme="dark" aria-pressed="${state.appearance==='dark'}">ダークモード</button></div><p>${state.page==='camera'?'映像・配信マイク・カメラ調整・送信品質':'コメント表示・読み上げ'}</p>`;else if(modal==='connection')content=`<h2>スマホ連携</h2><p>自宅のPC · Tailscale<br>${state.connected?'接続済み':'接続待ち'}</p><button class="qc-button cursor-interaction" type="button" data-action="qr">PCのQRコードを読み取る</button>`;else if(modal==='qr')content='<h2>PCのQRを読み取る</h2><p>PC版の設定 → スマホ連携 → 共通QR</p>';else content=`<h2>${modal==='send'?'映像・音声の送信を停止しますか？':state.broadcast?'OBS配信を終了しますか？':'OBS配信を開始しますか？'}</h2><p>${modal==='send'?'スマホの映像とマイク音声を止めます。OBS配信・コメント・読み上げは継続します。':'スマホの映像・音声送信と読み上げは変更しません。'}</p><button class="qc-button cursor-interaction" type="button" data-action="confirm">${modal==='send'?'送信を停止':'実行する'}</button>`;return `<div class="qc-overlay"><section class="qc-sheet" role="dialog" aria-modal="true" aria-label="${modal==='settings'?'設定':modal==='connection'?'スマホ連携':'操作の確認'}">${content}<button class="qc-button cursor-interaction" type="button" data-action="close">${['send','obs'].includes(modal)?'キャンセル':'閉じる'}</button></section></div>`;}
  function metrics(){for(const phone of root.querySelectorAll('[data-phone]')){if(!phone.checkVisibility())continue;const h=phone.querySelector('.qc-header').offsetHeight+(phone.querySelector('.qc-page-heading')?.offsetHeight||0);const f=phone.querySelector('.qc-footer').offsetHeight;root.querySelector(`[data-measure="${phone.dataset.phone}"]`).textContent=`上部 ${h}px · 下部 ${f}px · 本文 ${phone.querySelector('.qc-main').clientHeight}px`;}}
  function render(){const active=document.activeElement;const focused=active?.closest('[data-phone]')?{phone:active.closest('[data-phone]').dataset.phone,action:active.dataset.action,page:active.dataset.page,theme:active.dataset.theme}:null;const scrolls=new Map([...root.querySelectorAll('[data-phone]')].map(p=>[p.dataset.phone,p.querySelector('.qc-main')?.scrollTop||0]));root.dataset.appearance=state.appearance;root.dataset.largeText=String(state.scale===2);root.style.setProperty('--qc-scale',state.scale);for(const phone of root.querySelectorAll('[data-phone]')){const id=phone.dataset.phone;phone.classList.toggle('qc-current',id==='R');phone.innerHTML=`<div class="qc-statusbar"><span>20:41</span><span>▥ · 82% ▰</span></div>${header(id)}${body()}${footer(id)}<div class="qc-home"><span></span></div>${sheet()}`;phone.querySelector('.qc-main').scrollTop=scrolls.get(id)||0;}root.querySelector('[data-payload]').textContent=JSON.stringify({...state,dialog:modal},null,2);if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});if(focused?.action){let selector=`[data-phone="${focused.phone}"] [data-action="${focused.action}"]`;if(focused.page)selector+=`[data-page="${focused.page}"]`;if(focused.theme)selector+=`[data-theme="${focused.theme}"]`;root.querySelector(selector)?.focus({preventScroll:true});}requestAnimationFrame(metrics);}
  function save(){window.openai?.setWidgetState?.({modelContent:{compactChrome:{...state}},privateContent:null})?.catch(()=>{});}
  function changePage(page){if(modal||state.page===page)return;state.page=page;render();save();}
  function closeSheet(){modal=null;render();const target=focusReturn;focusReturn=null;target&&root.querySelector(`[data-phone="${target.phone}"] [data-action="${target.action}"]`)?.focus();}
  root.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const actionName=button.dataset.action;const phoneId=button.closest('[data-phone]').dataset.phone;if(actionName==='page'){changePage(button.dataset.page);return;}if(actionName==='close'){closeSheet();return;}if(actionName==='theme'){state.appearance=button.dataset.theme;render();save();return;}if(actionName==='confirm'){if(modal==='send')state.sending=false;else if(modal==='obs'&&state.connected)state.broadcast=!state.broadcast;closeSheet();save();return;}if(actionName==='mic')state.mute=!state.mute;else if(actionName==='video')state.video=!state.video;else if(actionName==='read')state.listening=!state.listening;else if(actionName==='send'){if(state.sending)modal='send';else state.sending=true;}else if(actionName==='obs'&&state.connected)modal='obs';else if(['settings','connection','qr'].includes(actionName))modal=actionName;if(modal&&actionName!=='qr')focusReturn={phone:phoneId,action:actionName};render();save();if(modal)root.querySelector(`[data-phone="${phoneId}"] .qc-sheet button`)?.focus();});
  root.querySelector('[data-scenario]').addEventListener('change',event=>{state.connected=event.target.value!=='offline';state.sending=event.target.value!=='ready';state.listening=event.target.value!=='ready';state.broadcast=event.target.value!=='ready';modal=null;render();save();});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal){event.preventDefault();closeSheet();return;}if(modal){const currentSheet=event.target.closest('.qc-sheet');if(event.key==='Tab'&&currentSheet){const buttons=[...currentSheet.querySelectorAll('button:not(:disabled)')];const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&event.target===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&event.target===last){event.preventDefault();first.focus();}}return;}if(event.target.closest('button,input,select,textarea,[contenteditable]'))return;if(event.key==='ArrowLeft'&&state.page==='camera')changePage('comments');if(event.key==='ArrowRight'&&state.page==='comments')changePage('camera');});
  let gesture=null;root.addEventListener('pointerdown',event=>{if(modal||event.button!==0||event.target.closest('button,input,select,textarea,a,[contenteditable]')||!event.target.closest('.qc-main'))return;if(gesture){gesture=null;return;}gesture={id:event.pointerId,x:event.clientX,y:event.clientY,time:event.timeStamp};});
  root.addEventListener('pointermove',event=>{if(!gesture)return;if(event.pointerId!==gesture.id||event.timeStamp-gesture.time>700||Math.abs(event.clientY-gesture.y)>12&&Math.abs(event.clientY-gesture.y)>=Math.abs(event.clientX-gesture.x))gesture=null;});
  root.addEventListener('pointerup',event=>{const start=gesture;gesture=null;if(!start||start.id!==event.pointerId||event.timeStamp-start.time>700)return;const dx=event.clientX-start.x,dy=event.clientY-start.y;if(Math.abs(dx)>=56&&Math.abs(dx)>=Math.abs(dy)*1.5){if(dx<0&&state.page==='camera')changePage('comments');else if(dx>0&&state.page==='comments')changePage('camera');}});
  root.addEventListener('pointercancel',()=>{gesture=null;});window.addEventListener('blur',()=>{gesture=null;});window.addEventListener('pointerup',event=>{if(!root.contains(event.target))gesture=null;});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)gesture=null;});
  window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState?.modelContent?.compactChrome);modal=null;render();});
  new MutationObserver(metrics).observe(root.querySelector('.viz-carousel'),{subtree:true,attributes:true,attributeFilter:['hidden']});new ResizeObserver(metrics).observe(root);
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'scale',{label:'文字倍率',min:1,max:2,step:1});tweak.addSelect(state,'appearance',{label:'配色',options:[{label:'ライトモード',value:'light'},{label:'ダークモード',value:'dark'}]});}
  window.casmateCompactMock={getState:()=>({...state,dialog:modal}),setState:value=>{restore(value);modal=null;render();},metrics};
})();
</script>
