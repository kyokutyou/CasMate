<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">きゃすメイト アプリアイコン</title>
  <desc id="desc">紫の吹き出しと白い3本の音声波形、ピンクの尻尾</desc>
  <defs>
    <linearGradient id="body" x1="250" y1="205" x2="795" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A996FF"/>
      <stop offset="0.46" stop-color="#8667FF"/>
      <stop offset="1" stop-color="#7150E9"/>
    </linearGradient>
    <linearGradient id="tail" x1="700" y1="670" x2="860" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8ABE"/>
      <stop offset="1" stop-color="#FF6FAE"/>
    </linearGradient>
    <linearGradient id="wave" x1="512" y1="294" x2="512" y2="604" gradientUnits="userSpaceOnUse">
